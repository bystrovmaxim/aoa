name: CI

on:
  pull_request:
    # main, and the feature branches that sub-issues merge into before main
    # (e.g. feature/issue-273-graph-history), so every step is checked on its way.
    branches:
      - main
      - "feature/**"

# Three jobs, run in parallel. Each one calls the same runner, so the local run and CI run the
# same commands from one table (`scripts/check_run.py`):
#   checks     — the deterministic gate (static checks, client build and unit tests,
#                ERD scripts, Python tests minus benchmarks, graph files check);
#   packaging  — the wheel/sdist build and the install smoke;
#   local-run  — the proof that the full local run passed on this commit.
# The three-engine layout check is not here: these machines have no graphics card, so Firefox
# has no WebGL and the map cannot be drawn. It runs in the full local run, and `local-run` fails a
# pull request whose commit does not carry that run's proof.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/maxitor/front/client/package-lock.json

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Project environment
        run: uv sync --all-extras

      - name: Check run (checks)
        run: bash scripts/run_checks_with_log.sh --where ci --skip-group packaging

      # The runner keeps each step's output in the log file, so a failure in CI would otherwise
      # show only its FAIL line; print the log so the failing step's own output is in the job log.
      - name: Show the check log on failure
        if: failure()
        run: cat archive/logs/check-all.txt || true

      # Maxitor's own action, the one other projects use, here running this checkout's graph-builder:
      # this is the only place it runs before someone else depends on it.
      - name: Graph files are current (graph-builder action)
        uses: ./packages/maxitor/tools/graph_builder
        with:
          graph-builder: uv run --extra dev graph-builder

      # The graph files (graph-builder.toml) must be what the code builds: the check above only
      # reads them. The developer runs `graph-builder write` locally and commits the files with the
      # change, so any modification here is a failure.
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Uncommitted changes found"
            git status -s
            exit 1
          fi
          echo "✅ All changes are committed"

      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "🌿 Branch: $BRANCH"
          if [[ "$BRANCH" == "main" ]]; then
            echo "❌ Cannot PR directly from main"
            exit 1
          fi
          echo "✅ Branch name is valid"

  local-run:
    name: Proof of the local run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The head of the pull request, not `github.sha`: that is GitHub's own merge commit, and
      # nobody ran it. No uv here: the runner is the standard library alone.
      - name: The commit carries the proof of the full local run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_run.py --await-sign-off "$COMMIT"

  packaging:
    name: Packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Project environment
        run: uv sync --all-extras

      - name: Check run (packaging)
        run: bash scripts/run_checks_with_log.sh --where ci --only-group packaging

      - name: Show the check log on failure
        if: failure()
        run: cat archive/logs/check-all.txt || true
