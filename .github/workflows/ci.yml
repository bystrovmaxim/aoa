name: CI

on:
  pull_request:
    # main, and the feature branches that sub-issues merge into before main
    # (e.g. feature/issue-273-graph-history), so every step is checked on its way.
    branches:
      - main
      - "feature/**"

# A first job reads what changed, then four jobs run in parallel. Each one calls the same runner, so the local run and CI run the
# same commands from one table (`scripts/check_run.py`):
#   checks     — the deterministic gate (static checks, client build and unit tests,
#                ERD scripts, Python tests minus benchmarks, graph files check);
#   checks-314 — the same gate on Python 3.14, the newest version the project supports;
#   packaging  — the wheel/sdist build and the install smoke;
#   versions   — version-gate, on pull requests into main only: a task's sub-issues raise a version once.
# Maxitor, its client and its browser checks live in bystrovmaxim/gnomon; this CI checks AOA alone, and
# a pull request merges on these jobs.
jobs:
  # A pull request that changes only text proves nothing the checks below could test. A job skipped
  # by its `if` counts as passed for the merge rule, so nothing is left waiting.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anything but text changed
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$(git diff --name-only "$BASE...$HEAD" | grep -vE '^(docs/|specs/|AGENTS\.md$|\.specify/memory/)')" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  versions:
    name: Versions
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned by commit, so the action cannot name its release itself.
      - name: Every changed level raised its version
        uses: bystrovmaxim/version-gate@e0052e7ddbc429c726389ef945225cb22c5857a0 # v0.1.1
        with:
          version: v0.1.1

  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Project environment
        run: uv sync --all-extras

      - name: Check run (checks)
        run: bash scripts/run_checks_with_log.sh --where ci --skip-group packaging --skip-group examples

      # The runner keeps each step's output in the log file, so a failure in CI would otherwise
      # show only its FAIL line; print the log so the failing step's own output is in the job log.
      - name: Show the check log on failure
        if: failure()
        run: cat archive/logs/check-all.txt || true

      # The demo's graph file is current, checked by graph-builder's own action from gnomon, at the commit that
      # merged Maxitor 3.22.0 (protocol 1.8), with graph-builder from that same commit — the command of
      # GRAPH_BUILDER in scripts/check_run.py.
      - name: Graph files are current (graph-builder action)
        uses: bystrovmaxim/gnomon/packages/maxitor/tools/graph-builder@9ecc198834cc7df462a729f751ddf4870874cc35
        with:
          graph-builder: uvx --from git+https://github.com/bystrovmaxim/gnomon@9ecc198834cc7df462a729f751ddf4870874cc35#subdirectory=packages/maxitor graph-builder

      # The graph files (graph-builder.toml) must be what the code builds: the check above only
      # reads them. The developer runs `graph-builder write` locally and commits the files with the
      # change, so any modification here is a failure.
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Uncommitted changes found"
            git status -s
            exit 1
          fi
          echo "✅ All changes are committed"

      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          echo "🌿 Branch: $BRANCH"
          if [[ "$BRANCH" == "main" ]]; then
            echo "❌ Cannot PR directly from main"
            exit 1
          fi
          echo "✅ Branch name is valid"

  checks-314:
    name: Checks on Python 3.14
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Overrides .python-version for every uv call in this job.
      UV_PYTHON: "3.14"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Project environment
        run: uv sync --all-extras

      - name: Check run (checks)
        run: bash scripts/run_checks_with_log.sh --where ci --skip-group packaging --skip-group examples

      - name: Show the check log on failure
        if: failure()
        run: cat archive/logs/check-all.txt || true

  # Every example of the documentation, on a machine of its own: the job runs beside Checks, so
  # a pull request waits for the longer of the two instead of for both in a row.
  examples:
    name: Examples
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Project environment
        run: uv sync --all-extras

      - name: Check run (examples)
        run: bash scripts/run_checks_with_log.sh --where ci --only-group examples

      - name: Show the check log on failure
        if: failure()
        run: cat archive/logs/check-all.txt || true

      # An example may write files as it runs; none of them may change what the tree tracks.
      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Uncommitted changes found"
            git status -s
            exit 1
          fi
          echo "✅ All changes are committed"

  examples-314:
    name: Examples on Python 3.14
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Overrides .python-version for every uv call in this job.
      UV_PYTHON: "3.14"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Project environment
        run: uv sync --all-extras

      - name: Check run (examples)
        run: bash scripts/run_checks_with_log.sh --where ci --only-group examples

      - name: Show the check log on failure
        if: failure()
        run: cat archive/logs/check-all.txt || true

  packaging:
    name: Packaging
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Project environment
        run: uv sync --all-extras

      - name: Check run (packaging)
        run: bash scripts/run_checks_with_log.sh --where ci --only-group packaging

      - name: Show the check log on failure
        if: failure()
        run: cat archive/logs/check-all.txt || true
