# deploy/stand/docker-compose.yml — the demonstrator stand, four containers on one host.
#
# Both services build from the repository root (uv workspace) and publish their
# ports on the host's loopback only — the stand is reachable from outside
# exclusively through the host's existing TLS front end. The front-end network
# wiring lives in docker-compose.host.yml (the deploy script appends it on the
# host); local runs use this base file alone.

services:
  demo:
    build:
      context: ../..
      dockerfile: packages/aoa-demo/Dockerfile
    ports:
      - "127.0.0.1:${DEMO_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3) and sys.exit(0) or sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s

  maxitor:
    build:
      context: ../..
      dockerfile: packages/maxitor/front/Dockerfile
    environment:
      # Built graphs stay in memory until this many are held; then the one read longest ago leaves.
      # One graph of the reference service costs about 22 MiB of the process after #268, so 50 graphs
      # keep the process near 1.1 GiB at its peak. Lower it on a smaller machine.
      MAXITOR_MAX_GRAPHS: "${MAXITOR_MAX_GRAPHS:-50}"
      # Maxitor's own port, through which public GitHub links are read (spec 037, FR-003b).
      MAXITOR_PUBLIC_PORT: http://maxitor-public-port:8102
    ports:
      - "127.0.0.1:${MAXITOR_PORT:-8101}:8101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8101/api/health', timeout=3) and sys.exit(0) or sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s

  # The repo-graph-port service (#288): the only container that talks to GitHub and the only
  # one that holds the GitHub App's private key and webhook secret. Its histories config lives
  # on the host, outside the repository, in a folder mounted writable — `repo-graph-port history
  # key new` writes key hashes into it; its git mirrors and version cache live in a volume.
  repo-graph-port:
    build:
      context: ../..
      dockerfile: packages/maxitor/tools/repo_graph_port/Dockerfile
    environment:
      MAXITOR_HISTORIES: /config/histories.toml
      # Behind the host's front end every request arrives from the proxy; trust its
      # X-Forwarded-For, so the limit on wrong keys counts real client addresses.
      FORWARDED_ALLOW_IPS: "*"
    env_file:
      # GITHUB_APP_PRIVATE_KEY and GITHUB_WEBHOOK_SECRET — written by the maintainer on the host.
      - path: /etc/aoa-repo-graph-port/secrets.env
        required: false
    volumes:
      - ${REPO_GRAPH_PORT_CONFIG_DIR:-/etc/aoa-repo-graph-port}:/config
      - repo-graph-port-cache:/var/cache/repo-graph-port
    ports:
      - "127.0.0.1:${REPO_GRAPH_PORT_PORT:-8103}:8102"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3) and sys.exit(0) or sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s

  # Maxitor's own port (#289): the same image as repo-graph-port, with an empty histories config, so
  # it reads public GitHub links and nothing else — no history, no key, no App. Only Maxitor reaches
  # it, by its name on the stand's network; it publishes no port.
  maxitor-public-port:
    build:
      context: ../..
      dockerfile: packages/maxitor/tools/repo_graph_port/Dockerfile
    environment:
      MAXITOR_HISTORIES: /config/histories.toml
    volumes:
      - ./maxitor-public-port:/config:ro
      - maxitor-public-port-cache:/var/cache/repo-graph-port
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3) and sys.exit(0) or sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  repo-graph-port-cache:
  maxitor-public-port-cache:
