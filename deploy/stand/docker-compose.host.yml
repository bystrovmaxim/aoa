# deploy/stand/docker-compose.host.yml — host-only wiring for the demonstrator stand.
#
# On the host the stand joins the front end's docker network (up2y-net) under
# its aliases, so the nginx-proxy container can proxy by name. Locally this
# network does not exist, which is why it lives in this override: the deploy
# script appends this file on the host, and local runs use the base compose alone.

services:
  demo:
    networks:
      frontend:
        aliases:
          - dev_aoa_demo

  maxitor:
    networks:
      frontend:
        aliases:
          - dev_aoa_maxitor
      # The stand's own network, where Maxitor reaches its own port (maxitor-public-port).
      default:

  repo-graph-port:
    networks:
      frontend:
        aliases:
          - dev_aoa_repo_graph_port
      # The port reaches GitHub through a network of its own: the host's interface carries 1450-byte
      # packets, the front end's network sends 1500, and a TLS handshake then never completes.
      egress:
        gw_priority: 1

  # Maxitor's own port reaches GitHub like repo-graph-port; it stays off the front end's network,
  # and Maxitor reaches it on the stand's own (default) network.
  maxitor-public-port:
    networks:
      default:
      egress:
        gw_priority: 1

networks:
  frontend:
    name: up2y-net
    external: true
  # The host's MTU (1450, its ens3), so packets to the internet are never larger than the host can send.
  egress:
    driver_opts:
      com.docker.network.driver.mtu: "1450"
