<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxitor — organization, enterprise, product, container · mockup</title>
<style>
  /* The mockup continues the visual language of today’s Maxitor: the same menu row sizes and the same panel and workspace colours. */
  :root {
    --page-bg: #e9edf1; --ink: #0f172a; --ink2: #1e293b; --muted: #64748b; --faint: #94a3b8;
    --line: rgba(15,23,42,.1); --line2: rgba(15,23,42,.06);
    --sidebar: #EBF2F5; --workspace: #f4f5f7; --canvas: #f6f8fa;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --p1: #0d9488; --p2: #ea580c; --p3: #7c3aed; --p4: #2563eb; --ext: #64748b;
    --s-backlog: #94a3b8; --s-elab: #8b5cf6; --s-ready: #3b82f6; --s-prog: #f59e0b; --s-done: #16a34a; --s-rej: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: var(--page-bg); display: flex; }
  button { font: inherit; color: inherit; }

  /* ---------- mockup navigator ---------- */
  .nav { width: 300px; flex-shrink: 0; height: 100vh; overflow-y: auto; background: #fff; border-right: 1px solid var(--line); padding: 18px 12px 32px; }
  .nav h1 { font-size: 15px; margin: 0 6px 4px; }
  .nav .sub { font-size: 12px; color: var(--muted); margin: 0 6px 12px; line-height: 1.45; }
  .nav .group { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 14px 6px 4px; }
  .nav button.screen { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 7px; font-size: 13px; cursor: pointer; }
  .nav button.screen:hover { background: rgba(15,23,42,.05); }
  .nav button.screen.on { background: rgba(15,23,42,.08); font-weight: 600; }
  .nav button.screen .n { color: var(--muted); font-size: 11px; min-width: 24px; font-variant-numeric: tabular-nums; }
  .path { margin: 6px 4px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .path .pt { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .path .pf { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .path .steps { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .path .steps button { border: 1px solid var(--line); background: #f8fafc; border-radius: 6px; font-size: 11px; padding: 2px 6px; cursor: pointer; }
  .path .steps button:hover { background: #eef2f7; }
  .path .steps span { color: var(--faint); font-size: 11px; }

  .stage { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; padding: 18px 24px 48px; }
  .frame-cap { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .frame-cap b { color: var(--ink); }
  .frame-box { position: relative; }
  .frame-scale { transform-origin: top left; position: absolute; top: 0; left: 0; }
  .notes { max-width: 980px; margin-top: 18px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 20px 16px; }
  .notes h2 { font-size: 15px; margin: 0 0 6px; }
  .notes li { font-size: 13px; line-height: 1.55; }
  .notes ul { padding-left: 18px; margin: 6px 0 0; }
  .notes code { font-size: 12px; background: #f1f5f9; padding: 1px 4px; border-radius: 4px; }
  .notes .q { border-left: 3px solid #fcd34d; background: #fffbeb; padding: 8px 12px; border-radius: 0 6px 6px 0; margin-top: 10px; font-size: 13px; line-height: 1.55; }

  /* ---------- layout ---------- */
  .device { width: 1360px; height: 840px; background: #fff; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 1px 2px rgba(15,23,42,.08), 0 8px 28px rgba(15,23,42,.12); }

  /* header: breadcrumb switchers, search, snapshot, user */
  .hdr { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 12px; background: #fff; border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
  .logo { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13.5px; margin-right: 8px; cursor: pointer; }
  .logo .mk { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .crumbs { display: flex; align-items: center; min-width: 0; }
  .crumb { display: inline-flex; align-items: center; height: 28px; border-radius: 7px; font-size: 13px; color: var(--ink2); white-space: nowrap; }
  .crumb .ct { padding: 0 6px 0 8px; height: 28px; display: inline-flex; align-items: center; gap: 6px; border-radius: 7px 0 0 7px; cursor: pointer; }
  .crumb .cvr { width: 22px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 0 7px 7px 0; cursor: pointer; color: var(--muted); }
  .crumb .ct:hover, .crumb .cvr:hover { background: rgba(15,23,42,.06); }
  .crumb.cur .ct { font-weight: 600; color: var(--ink); }
  .crumb .lv { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .crumb .dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .sep { color: #cbd5e1; margin: 0 1px; font-size: 14px; }
  .hdr .spacer { flex: 1; }
  .search { display: inline-flex; align-items: center; gap: 8px; width: 260px; height: 30px; padding: 0 8px 0 10px; border: 1px solid var(--line); border-radius: 8px; background: #f8fafc; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  .search kbd { margin-left: auto; font-family: inherit; font-size: 11px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .snap { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 9px; border-radius: 8px; background: rgba(15,23,42,.05); font-size: 12.5px; color: #334155; cursor: pointer; white-space: nowrap; }
  .snap b { color: var(--ink); }
  .snap.past { background: #fef3c7; color: #78350f; }
  .snap.past b { color: #78350f; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #cbd5e1; color: #1e293b; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: 4px; }
  .ico { width: 16px; height: 16px; flex-shrink: 0; }
  .ico.sm { width: 14px; height: 14px; }

  .banner { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 7px 14px; background: #fef3c7; color: #78350f; font-size: 12.5px; border-bottom: 1px solid #fde68a; }
  .banner b { font-weight: 600; }
  .banner .lnk { margin-left: auto; text-decoration: underline; cursor: pointer; }

  .body { flex: 1; min-height: 0; display: flex; position: relative; }

  /* the layer’s left panel — as in today’s Maxitor */
  .sb { width: 255px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid rgba(15,23,42,.08); display: flex; flex-direction: column; overflow-y: auto; }
  .sb-top { padding: 12px 14px 8px; }
  .sb-top .k { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .sb-top .t { font-size: 14px; font-weight: 600; margin-top: 3px; display: flex; align-items: center; gap: 7px; }
  .sb-top .d { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .sb-cap { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 12px 16px 4px; display: flex; justify-content: space-between; }
  .sb-row { display: flex; align-items: center; gap: 8px; height: 31px; padding: 0 10px; margin: 0 6px; border-radius: 6px; font-size: 13px; color: var(--ink2); white-space: nowrap; cursor: pointer; }
  .sb-row:hover { background: rgba(15,23,42,.05); }
  .sb-row.sel { background: rgba(15,23,42,.09); }
  .sb-row svg { color: var(--muted); }
  .sb-row .c4 { margin-left: auto; font-size: 10.5px; color: var(--faint); font-weight: 600; letter-spacing: .03em; }
  .sb-row .num { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sb-row .sw { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .sb-row.l2 { padding-left: 36px; } .sb-row.l3 { padding-left: 58px; }
  .sb-row .marks { margin-left: auto; display: inline-flex; gap: 4px; }
  .mark { font-size: 9.5px; font-weight: 700; color: var(--muted); border: 1px solid rgba(15,23,42,.14); border-radius: 4px; padding: 0 3px; line-height: 14px; }
  .mark.live { color: #15803d; border-color: #86efac; background: #f0fdf4; }
  .sb-foot { margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px 12px; font-size: 11.5px; color: var(--muted); }
  .sb-foot b { color: var(--ink2); }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--workspace); position: relative; }
  .ctop { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line2); background: var(--workspace); }
  .ctop h3 { font-size: 15px; margin: 0; font-weight: 600; }
  .ctop .c4t { font-size: 11px; color: var(--muted); font-weight: 600; background: rgba(15,23,42,.06); border-radius: 5px; padding: 1px 6px; }
  .ctop .spacer { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 7px; font-size: 12px; color: #334155; background: #fff; border: 1px solid var(--line); white-space: nowrap; cursor: pointer; }
  .chip.on { background: #0f172a; color: #fff; border-color: #0f172a; }
  .chip .x { margin-left: 2px; opacity: .7; }
  .seg { display: inline-flex; background: rgba(15,23,42,.06); border-radius: 8px; padding: 2px; }
  .seg button { border: 0; background: none; height: 24px; padding: 0 10px; border-radius: 6px; font-size: 12px; color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.12); font-weight: 600; }
  .cbody { flex: 1; min-height: 0; overflow: auto; position: relative; }
  .dots { background-color: var(--canvas); background-image: radial-gradient(rgba(15,23,42,.13) 1px, transparent 1px); background-size: 18px 18px; }

  /* ---------- sign-in ---------- */
  .auth { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--canvas); }
  .card { width: 400px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px 30px 24px; box-shadow: 0 8px 30px rgba(15,23,42,.08); }
  .card .lg { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; margin-bottom: 18px; }
  .card .lg .mk { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  .card h2 { font-size: 19px; margin: 0 0 4px; }
  .card .sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.45; }
  .lab { font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 5px; }
  .inp { height: 38px; border: 1px solid rgba(15,23,42,.2); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; font-size: 13.5px; color: var(--ink2); margin-bottom: 12px; background: #fff; }
  .btn { height: 38px; border-radius: 8px; border: 0; background: var(--ink); color: #fff; font-weight: 600; font-size: 13.5px; width: 100%; cursor: pointer; }
  .btn.ghostb { background: #fff; color: var(--ink); border: 1px solid rgba(15,23,42,.18); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .or { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 12px; margin: 14px 0; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .fine { font-size: 11.5px; color: var(--muted); margin-top: 16px; line-height: 1.45; }
  .inviter { display: flex; gap: 10px; align-items: center; background: #f8fafc; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 16px; font-size: 13px; }

  /* ---------- enterprise picker ---------- */
  .pick { flex: 1; overflow: auto; background: var(--canvas); padding: 34px 48px; }
  .pick h2 { font-size: 22px; margin: 0 0 4px; }
  .pick .sub { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
  .resume { display: flex; gap: 12px; margin-bottom: 26px; }
  .resume .r { flex: 1; max-width: 360px; display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .resume .r:hover { border-color: rgba(15,23,42,.28); }
  .resume .r .w { font-size: 11.5px; color: var(--muted); }
  .resume .r .h { font-size: 13.5px; font-weight: 600; margin-top: 1px; }
  .egrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; max-width: 1100px; }
  .ecard { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; cursor: pointer; display: flex; flex-direction: column; min-height: 178px; }
  .ecard:hover { border-color: rgba(15,23,42,.3); box-shadow: 0 6px 20px rgba(15,23,42,.08); }
  .ecard .eh { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .ecard .ep { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.45; flex: 1; }
  .ecard .es { display: flex; gap: 14px; font-size: 12px; color: #475569; margin-top: 12px; }
  .ecard .es b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .ecard .ef { font-size: 11.5px; color: var(--faint); margin-top: 10px; border-top: 1px solid var(--line2); padding-top: 8px; display: flex; justify-content: space-between; }
  .ecard .prods { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  .pchip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: #334155; background: #f1f5f9; border-radius: 5px; padding: 1px 7px 1px 6px; white-space: nowrap; }
  .pchip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .lock { color: #b45309; }

  /* ---------- map (USM) ---------- */
  .mapbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--line2); background: var(--workspace); flex-wrap: wrap; }
  .legend { display: flex; gap: 10px; margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .sd { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .usm { display: grid; padding: 14px 16px 30px; gap: 0; width: max-content; }
  .usm .corner { position: sticky; left: 0; z-index: 3; background: var(--canvas); }
  .area { background: #fde68a; border: 1px solid rgba(146,64,14,.18); border-radius: 6px; margin: 0 3px 6px; padding: 7px 10px; font-size: 12.5px; font-weight: 600; color: #713f12; display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; min-height: 46px; line-height: 1.3; }
  .area .own { font-size: 10.5px; font-weight: 500; color: #a16207; }
  .stg { background: #bfdbfe; border: 1px solid rgba(30,64,175,.16); border-radius: 6px; margin: 0 3px 10px; padding: 6px 9px; font-size: 12px; font-weight: 600; color: #1e3a8a; }
  .slice-h { position: sticky; left: 0; z-index: 2; background: var(--canvas); padding: 10px 10px 0 2px; border-top: 2px dashed rgba(15,23,42,.18); }
  .slice-h .sn { font-size: 13px; font-weight: 700; }
  .slice-h .sg { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.35; }
  .slice-h .st { font-size: 11px; color: #475569; margin-top: 6px; }
  .cell { border-top: 2px dashed rgba(15,23,42,.18); padding: 8px 3px 10px; min-height: 64px; display: flex; flex-direction: column; gap: 6px; }
  .story { background: #fff; border: 1px solid rgba(15,23,42,.12); border-radius: 6px; padding: 6px 8px 6px; font-size: 12px; line-height: 1.35; cursor: pointer; box-shadow: 0 1px 1px rgba(15,23,42,.04); }
  .story:hover { border-color: rgba(15,23,42,.35); }
  .story.sel { outline: 2px solid #0f172a; outline-offset: 1px; }
  .story.dim { opacity: .22; }
  .story .sp { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); margin-bottom: 3px; }
  .story .sp i { width: 7px; height: 7px; border-radius: 2px; }
  .story .stt { color: var(--ink2); }
  .story .sf { display: flex; align-items: center; gap: 5px; margin-top: 5px; font-size: 10.5px; color: var(--muted); }
  .story .sf .ow { margin-left: auto; width: 17px; height: 17px; border-radius: 50%; background: #e2e8f0; color: #334155; font-size: 8.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .story.rej .stt { text-decoration: line-through; color: var(--faint); }
  .ghost-more { font-size: 11px; color: var(--faint); padding: 2px 4px; }

  /* ---------- tables ---------- */
  .tbl-wrap { padding: 14px 16px 30px; }
  table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 12.5px; }
  .tbl th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 9px 12px; background: #f8fafc; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line2); vertical-align: middle; color: var(--ink2); }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tr.click { cursor: pointer; }
  .tbl tr.click:hover td { background: #f8fafc; }
  .tbl .nm { font-weight: 600; color: var(--ink); }
  .tbl .mut { color: var(--muted); }
  .tbl .num { font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .b-draft { background: #f1f5f9; color: #475569; } .b-approved { background: #dbeafe; color: #1e40af; } .b-done { background: #dcfce7; color: #166534; } .b-rejected { background: #fee2e2; color: #991b1b; }
  .b-kind { background: #f1f5f9; color: #334155; font-weight: 500; }
  .bar { width: 90px; height: 6px; border-radius: 3px; background: #e2e8f0; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .bar i { display: block; height: 100%; background: var(--s-done); }
  .who { display: inline-flex; align-items: center; gap: 6px; }
  .who .av { width: 20px; height: 20px; border-radius: 50%; background: #e2e8f0; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; color: #334155; }
  .tbl-cap { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .tbl-cap b { color: var(--ink); }

  /* ---------- C1 and C2 diagrams ---------- */
  .diagram { padding: 10px 16px 20px; }
  svg.dg { display: block; }
  .dg .bnd { fill: rgba(255,255,255,.55); stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 6 5; }
  .dg .bnd-l { font-size: 12px; fill: #475569; font-weight: 600; }
  .dg .node rect { stroke-width: 1.4; }
  .dg .node { cursor: pointer; }
  .dg .node:hover rect.box { filter: drop-shadow(0 4px 10px rgba(15,23,42,.18)); }
  .dg .nt { font-size: 14px; font-weight: 700; }
  .dg .nk { font-size: 10.5px; letter-spacing: .03em; }
  .dg .nd { font-size: 11px; }
  .dg .edge { stroke: #64748b; stroke-width: 1.5; fill: none; }
  .dg .edge.hot { stroke: #ea580c; stroke-width: 2; }
  .dg .el { font-size: 10.5px; fill: #334155; }
  .dg .elb { fill: #fff; stroke: rgba(15,23,42,.15); }
  .dg .cnt { font-size: 10.5px; font-weight: 700; fill: #334155; }
  .dleg { display: flex; gap: 16px; font-size: 11.5px; color: var(--muted); padding: 0 16px 6px; }
  .dleg span { display: inline-flex; align-items: center; gap: 6px; }
  .dleg i { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }

  /* ---------- story panel ---------- */
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 430px; background: #fff; border-left: 1px solid var(--line); box-shadow: -12px 0 30px rgba(15,23,42,.08); z-index: 15; display: flex; flex-direction: column; }
  .dh { padding: 14px 18px 10px; border-bottom: 1px solid var(--line2); }
  .dh .dk { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .dh .dk .close { cursor: pointer; font-size: 16px; color: var(--muted); }
  .dh h3 { font-size: 16px; margin: 6px 0 4px; line-height: 1.3; }
  .dh .dt { font-size: 12.5px; color: #475569; line-height: 1.45; }
  .life { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .life span { font-size: 11px; padding: 2px 7px; border-radius: 10px; background: #f1f5f9; color: var(--faint); }

           background: rgba(241,245,249,.94); border: 1px solid rgba(15,23,42,.08); border-radius: 20px; box-shadow: 0 1px 3px rgba(15,23,42,.08); white-space: nowrap; }

  .fpanel { position: absolute; top: 12px; left: 12px; z-index: 6; width: 200px; max-height: calc(100% - 70px); overflow-y: auto; cursor: default;
            background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 10px; font-size: 12px; box-shadow: 0 1px 3px rgba(15,23,42,.06); }

  /* ---------- the filter — always like the DOMAINS/KINDS panel in Maxitor ---------- */

  }

  const zoomAt = (mx, my, f) => { const nk = Math.min(2.5, Math.max(.25, cam.k * f)); cam.x = mx - (mx - cam.x) * nk / cam.k; cam.y = my - (my - cam.y) * nk / cam.k; cam.k = nk; apply(); };
  apply();
  cv.addEventListener("wheel", e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt((e.clientX - r.left) / FS, (e.clientY - r.top) / FS, Math.exp(-e.deltaY * .0015)); }, { passive: false });
  const overlay = el => el.closest(".fpanel, .vtabs, .zoombar, .lgd");
  let drag = null, moved = false;
  cv.addEventListener("mousedown", e => { if (overlay(e.target) || e.button !== 0 || e.target.closest(".story, [contenteditable]")) return; drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; moved = false; });
  window.onmousemove = e => { if (!drag) return; const dx = (e.clientX - drag.x) / FS, dy = (e.clientY - drag.y) / FS; if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; cv.classList.add("drag"); } if (moved) { cam.x = drag.cx + dx; cam.y = drag.cy + dy; apply(); } };
  window.onmouseup = () => { drag = null; cv.classList.remove("drag"); };
  cv.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  cv.querySelectorAll("[data-z]").forEach(b => b.onclick = () => {
    const cw = cv.clientWidth / 2, ch = cv.clientHeight / 2;
    if (b.dataset.z === "in") zoomAt(cw, ch, 1.2); else if (b.dataset.z === "out") zoomAt(cw, ch, 1 / 1.2); else { Object.assign(cam, fitCam()); apply(); }
  });
}

/* ======================= map (USM) ======================= */
function viewMap(scope) {
  const stages = AREAS.flatMap(a => a.stages.map(([id, n]) => ({ id, n, a })));
  const cols = `150px repeat(${stages.length}, 168px) 118px`;
  const ro = !!(S.snap || S.cmp);
  let html = `<div class="usm" style="grid-template-columns:${cols};padding:0">`;
  html += `<div class="corner"></div>`;
  /* As on a paper map: a business area’s card stands over its first stage, and the following stages go without a card above them. */
  for (const a of AREAS) html += `<div class="area"><span>${a.name}</span><span class="own">${a.owner ? INI[a.owner] : "—"}</span></div>` + "<div></div>".repeat(a.stages.length - 1);
  html += ro ? "<div></div>" : `<div class="addc" onclick="addArea()" title="A new business area — at once with its first stage">+ business area</div>`;
  html += `<div class="corner"></div>`;
  for (const s of stages) html += `<div class="stg">${s.n}</div>`;
  html += ro ? "<div></div>" : `<div class="addc stgadd" onclick="addStage()" title="A new stage in the last business area">+ stage</div>`;
  for (const sl of SLICES) {
    const inSlice = STORIES.filter(s => s.r === sl.id);
    const shown = scope ? inSlice.filter(s => s.p === scope) : inSlice;
    const done = shown.filter(s => s.st === "done").length;
    html += `<div class="slice-h"><div class="sn">${sl.name}</div><div class="sg">${sl.goal}</div><div class="st">${sl.date ? sl.date + " · " : ""}${done} of ${shown.length} done</div></div>`;
    for (const g of stages) {
      const cell = inSlice.filter(s => s.g === g.id);
      const mine = scope ? cell.filter(s => s.p === scope) : cell;
      const others = cell.length - mine.length;
      const key = g.id + "|" + sl.id;
      const [dFrom, dTo] = S.dnd ? S.dnd.split(">") : [null, null];
      let inner = mine.map(st => st.id === dFrom ? `<div class="story ph">${esc(st.t)}</div>` : storyCard(st)).join("");
      if (dTo === key) { const ds = STORIES.find(x => x.id === dFrom); inner += `<div class="lift">${storyCard(ds)}<span class="liftcap">${moveCaption(ds, g.id, sl.id)}</span></div>`; }
      if (S.cmp && !cmpQuiet()) for (const [sid, d] of Object.entries(CMP.stories)) { const ms = storyOf(sid); if (d.moved === key && (!scope || ms.p === scope)) inner += `<div class="story ghostmv"><div class="stt">${esc(ms.t)}</div><div class="sf">was here at A · moved</div></div>`; }
      if (S.coedit && key === "g8|r2") inner += `<div class="story typing" style="--pc:#2563eb"><div class="stt">A technician marks that the resident is not at home<span class="caret"></span></div><span class="pres" style="background:#2563eb">OS is typing</span></div>`;
      if (S.newIn === key && !ro) inner += `<div class="story newc"><div class="stt" id="newst" contenteditable="true" spellcheck="false">A technician photographs the work before and after</div><div class="nacts"><button class="btn2 pri" onclick="event.stopPropagation();addStory('${g.id}','${sl.id}')">Add</button><span class="mut">Esc — cancel</span></div></div>`;
      const dnd = ro ? "" : ` ondragover="dOver(event,this)" ondragleave="this.classList.remove('drop')" ondrop="dDrop(event,'${g.id}','${sl.id}')"`;
      html += `<div class="cell${dTo === key ? " drop" : ""}"${dnd}>${inner}${scope && others - cell.filter(x => !x.p).length ? `<div class="ghost-more">+${others - cell.filter(x => !x.p).length} in other products</div>` : ""}${scope && cell.some(x => !x.p) ? `<div class="ghost-more">+${cell.filter(x => !x.p).length} without a Software System</div>` : ""}${ro || S.newIn === key ? "" : `<div class="cadd" onclick="event.stopPropagation();go({newIn:'${key}',story:null})">+ story</div>`}</div>`;
    }
    html += `<div class="cell xcol"></div>`;
  }
  html += ro ? `</div>` : `<div class="addr" onclick="addSlice()">+ release slice</div></div>`;
  const inScope = STORIES.filter(s => !scope || s.p === scope);
  const tabs = [{ l: "Map", n: inScope.length, on: S.mapMode !== "table", go: "go({mapMode:'map'})", c: "#d97706" },
                { l: "Stories", n: inScope.length, on: S.mapMode === "table", go: "go({mapMode:'table'})", c: "#475569" }];
  const m = S.mh;
  const prodSec = { t: "Products", rows: scope
    ? [{ l: PRODUCTS[scope].name, c: PRODUCTS[scope].hex, icon: BI.box, sel: true, go: "" }, { l: "The whole enterprise map", c: "#94a3b8", icon: BI.globe, go: "go({screen:'ent',view:'map'})" }]
    : Object.entries(PRODUCTS).map(([id, p]) => ({ l: p.name, c: p.hex, icon: BI.box, off: hid(m, "p:" + id), go: `tgl('mh','p:${id}')` })).concat([{ l: "without a Software System", c: "#b45309", icon: BI.box, off: hid(m, "p:none"), go: "tgl('mh','p:none')" }]) };
  const sliceSec = { t: "Release slices", open: true, rows: SLICES.map(sl => ({ l: sl.name, c: sl.id === "r1" ? "#16a34a" : sl.id === "r2" ? "#3b82f6" : "#94a3b8", icon: BI.layer, off: hid(m, "r:" + (sl.id || "none")), go: `tgl('mh','r:${sl.id || "none"}')` })) };
  const iniSec = { t: "Initiatives", rows: Object.entries(INITIATIVES).filter(([id]) => inScope.some(s => s.n === id)).map(([id, n]) => ({ l: n.name, c: { draft: "#64748b", approved: "#2563eb", done: "#16a34a", rejected: "#dc2626" }[n.status], icon: BI.flag, off: S.fIni ? S.fIni !== id : hid(m, "n:" + id), go: `tgl('mh','n:${id}')` })).concat([{ l: "without an initiative", c: "#94a3b8", icon: BI.flag, off: S.fIni ? true : hid(m, "n:none"), go: "tgl('mh','n:none')" }]) };
  const stSec = { t: "States", rows: Object.entries(STATUS).map(([k, [n]]) => ({ l: n, c: STC[k], icon: BI.dot, off: hid(m, "st:" + k), go: `tgl('mh','st:${k}')` })) };
  const filter = fpanel("map", S.cmp && !cmpQuiet() ? [cmpSec("mh"), prodSec, sliceSec, iniSec, stSec] : [prodSec, sliceSec, iniSec, stSec]);
  if (S.mapMode === "table") {
    const stageOf = g => AREAS.flatMap(a => a.stages.map(([id, n]) => ({ id, n, a }))).find(x => x.id === g);
    const tr = inScope.filter(s => !mapHidden(s)).map(s => { const g = stageOf(s.g), sl = SLICES.find(x => x.id === s.r), [sn, sc] = STATUS[s.st];
      return `<tr class="click" onclick="go({story:'${s.id}'})"><td class="nm">${esc(s.t)}</td><td class="mut">${g.a.name} › ${g.n}</td><td>${sl && sl.id ? sl.name : '<span class="mut">not planned</span>'}</td>
        <td><span class="who"><i class="sd" style="background:${sc}"></i>${sn}</span></td><td>${s.p ? `<span class="pchip"><i style="background:${PRODUCTS[s.p].color}"></i>${PRODUCTS[s.p].name}</span>` : '<span class="mut">without a Software System</span>'}</td>
        <td class="mut">${s.n ? esc(INITIATIVES[s.n].name) : "—"}</td><td><span class="who"><span class="av">${s.o ? INI[s.o] : "—"}</span></span></td><td class="num">${PLANS[s.id] ? PLANS[s.id].filter(x => x.done).length + "/" + PLANS[s.id].length : "—"}</td></tr>`; }).join("");
    return { tabs, filter, fkey: "map", world: wcard(scope ? `The product’s stories ${PRODUCTS[scope].name}` : "Stories", "The same map, only as a table: the same filter on the left. A click opens the story.",
      `<table class="tbl"><tr><th>Story</th><th>Business area › Stage</th><th>Release slice</th><th>State</th><th>Product</th><th>Initiative</th><th>Owner</th><th>Steps</th></tr>${tr}</table>`) };
  }
  return { focus: true, tabs, filter, fkey: "map", world: html };
}

function render() {
  const app = document.getElementById("app");
  let html = "";
  if (S.screen === "signin") html = viewSignin();
  else if (S.screen === "invite") html = viewInvite();
  else if (S.screen === "picker") html = header(true) + `<div class="body">${viewPicker()}</div>`;
  else if (S.screen === "admin") html = header(true) + `<div class="body">${sbAdmin()}<div class="content">${canvas(viewAdmin())}${S.usr ? userDrawer() : S.ead ? entAccessDrawer() : ""}</div></div>`;
  else {
    let sb = "", main = "";
    if (S.screen === "ent") {
      sb = sbEnterprise();
      const v = S.view === "map" ? viewMap(null) : S.view === "c1" ? viewC1Enterprise() : S.view === "initiatives" ? viewInitiatives(null) : viewSystems();
      main = `<div class="content">${canvas(v)}${S.ead === S.ent ? entAccessDrawer() : S.cedit && !S.story ? contDrawer() : drawer()}</div>`;
    } else if (S.screen === "prod") {
      sb = sbProduct();
      const v = S.view === "map" ? viewMap(S.prod) : S.view === "c1" ? viewC1Product() : S.view === "c2" ? viewC2() : viewInitiatives(S.prod);
      main = `<div class="content">${canvas(v)}${S.cedit && !S.story ? contDrawer() : drawer()}</div>`;
    } else { sb = sbContainer(); main = viewGraph(); }
    html = header(false) + `<div class="body${S.follow ? " following" : ""}">${sb}${main}</div>`;
  }
  if (S.pop === "cmdk") html += popCmdk();
  else if (S.pop === "snap") html += popSnap();
  else if (S.pop === "codever") html += popCodeVer();
  else if (S.pop && S.pop.startsWith("room-")) html += popRoom(S.pop.slice(5));
  else if (S.pop === "invite") html += popInvite();
  else if (S.pop === "rm") html += popRemove();
  else if (S.pop === "newent") html += popNewEnt();
  else if (S.pop === "newcont") html += popNewCont();
  else if (S.pop === "newsys") html += popNewSys();
  else if (S.pop) html += popSwitch(S.pop);
  if (S.toast) html += toastHtml();
  app.innerHTML = html;
  renderNav(); renderNotes(); fit();
  bindCanvas();
}

  "8.3": ["Story: editing in place", ["The title and text are edited right in the panel. The Software System, initiative, release slice and owner are chosen with the arrow next to the value.", "The state buttons are only the moves of <code>UserStoryLifecycle</code> from the current state. “Done” is disabled until all steps are done, and it says why. Tick the second step — the button lights up.", "“+ plan step” adds a step. A step always points to exactly one container, so it has a container right away."]],
  "8.4": ["Mob elaboration with the model", ["The team in a room is working out the story “A technician writes off materials”, which has no Software System yet. At the top it shows who is in the card now; Ilya is editing the text.", "The model read the story and the containers’ graphs. It proposes a Software System and four steps, and every proposal says what it is based on.", "Accept, Edit, Reject. Only what is accepted enters the catalog, and the author of the change is whoever accepted it. Rejecting is not a catalog change: proposals are not stored in the catalog.", "Accept the Software System and at least one step — “Ready” lights up."]],
  "8.5": ["Shared editing on the map", ["Editing is live: in a room everyone sees the others’ edits at once. The card Ilya is editing now is outlined in his colour. Oleg is writing a new card right now in “Technician’s visit × Release 2”.", "There are no locks: who is editing what is visible, but nothing is forbidden."]],
  "8.6": ["New container", ["The form asks only for what the code does not have: the name, kind, a link to the graph, products and owner.", "Through the link Maxitor finds the graph and shows what it will take from it: the interfaces and what the container uses. This is how it will work once the graph learns to print adapters and resource targets (<code>catalog-filling</code>).", "“Create the container” adds “Materials warehouse” to FSM and opens its card. Nothing refers to it, so it can be deleted."]],
  "8.7": ["New Software System", ["Software Systems are created by hand: they are not in the code. Links to other Software Systems are not entered — they are derived from the containers.", "For a digital product its containers are chosen from all the enterprise’s containers. For an external system — a web link, and its only container is created together with it. The switch at the top changes the kind."]],
  "8.8": ["External container: interfaces by hand", ["The card opens with a click on an external container on the C2 diagram. We have no source code, so its interfaces and what it uses are entered by hand.", "Who uses its interfaces is derived from the code of our containers. So an interface that is used cannot be removed.", "An external system’s container is never deleted on its own: only together with the system."]],
  "8.9": ["Our container: cannot be deleted", ["The card opens with the “card” link in the container list. The interfaces and links of our container are read only: they come from the graph. Products and the owner are set by hand.", "Only what nothing refers to can be deleted. Plan steps refer to the FSM service, and other containers use its interfaces, so instead of a button it says what is in the way and where."]],
  "7.1": ["Administration · users", ["Only organization administrators see administration (<code>UserCoreEntity.is_admin</code>). It is entered from the enterprise picker and from the left panel of any enterprise.", "The table stands on the canvas, like every view. The filter on the left is the same as everywhere: states by <code>UserLifecycle</code>, role and how the user appeared.", "Removed users are hidden by the filter by default but do not vanish: removal is final, and what the person owned stays theirs.", "The left panel has short lists of signals: who has not accepted an invitation yet and who is blocked."]],
  "7.2": ["Invite a user", ["An invitation creates a user in the “Invitation sent” state. The name is optional: the person can correct it when they accept the invitation (screen 1.2).", "Open enterprises are available at once. Access to a closed one is granted by its owner, and by the administrator only if there is no owner or the owner is blocked. So “Pier” cannot be chosen here, while “Transit” can.", "With an email of the SSO domain no invitation is needed: the person signs in alone and becomes active at once.", "“Send the invitation” adds Kirill Belov to the list and opens his card."]],
  "7.3": ["User card", ["The buttons are the moves of <code>UserLifecycle</code> from the current state. Blocked Vera can be unblocked or removed.", "The “Administrator” mark is a switch. The last active administrator cannot be blocked, removed or lose the mark: the buttons go dim, and it says why. Remove the mark from Ilya — Anna’s buttons go dim.", "Access to closed enterprises. For “Pier” the switch is disabled: the owner, Maria Lebedeva, grants access. For “Transit” the owner is blocked, so the administrator grants access.", "The “Owns” block: what the person owns stays theirs after a block too. Wherever they are the owner, it is visible that they are blocked."]],
  "7.4": ["Remove for good", ["Removal is a final state with no move back, so it is confirmed separately.", "The window lists what the person owns: it stays theirs until the owner is changed. The administrator changes an enterprise’s owner only when there is no active owner, so before an active user is removed their enterprise stays theirs."]],
  "7.5": ["Access matrix", ["Another point of view on the same data: people in rows, enterprises in columns. An open enterprise shows “all”. A closed one shows who was granted access explicitly and who the owner is.", "This is a viewing-mode tab, not a filter: the filter on the left is the same as for the list."]],
  "7.6": ["The organization’s enterprises", ["The administrator sees all the organization’s enterprises, including closed ones without their access. Of such an enterprise only the name, the owner and the access list are visible: the description and the number of products are hidden.", "The “Manages access” column shows the rule: the owner, or, if there is no owner or the owner is blocked, the administrator.", "A new enterprise is created by the administrator."]],
  "7.7": ["A closed enterprise without access", ["“Transit” is closed, Anna has no access, and the owner, Vera Sokolova, is blocked. So the administrator manages access.", "“Grant access to myself” adds the administrator to <code>granted_users</code>. It is an ordinary catalog change: it stays in the history with its author and time and is visible on the track.", "The owner is blocked, so next to them there is “appoint another”. Were the owner active, there would be neither this link nor the “Grant access to myself” button: the owner grants access, and the administrator cannot replace an active owner."]],
  "7.8": ["New enterprise", ["The name names the enterprise’s end-to-end process. The story map is created together with it: an enterprise has exactly one.", "The owner is optional. While there is none, the administrator manages access."]],
  "7.9": ["Sign-in and SSO", ["A connected SSO sets an email domain (<code>OrganizationCoreEntity.sso_domain</code>). Whoever first signs in through it appears straight in the “Active” state — the second initial state of <code>UserLifecycle</code>.", "Sign-in by invitation always works. Which SSO providers to support and how many domains an organization may have is not decided yet."]],
  "7.10": ["Access from inside the enterprise", ["The owner manages access where they work. The line under the enterprise’s name in the left panel opens the same card over the map.", "Anna is the owner of “Northern Quarter”, so she can close it and grant access. Administration is not needed for this."]],
  "1.1": ["Sign in", ["Maxitor stops being open: the sign-in comes first. A user signs in with the email the invitation came to (<code>UserCoreEntity.email</code>), or through the organization’s SSO.", "Only a user in the “Active” state can sign in. Blocked and removed users cannot, and an invited one first accepts the invitation.", "After signing in, Maxitor opens where the user stopped. The enterprise picker is shown only on the first sign-in."]],
  "1.2": ["Accept the invitation", ["The link from the invitation opens this screen. Accepting moves the user from “Invitation sent” to “Active” by <code>UserLifecycle</code>."]],
  "2": ["Enterprise picker", ["The organization’s enterprise cards. A closed one is marked with a lock. Closed enterprises the user has no access to are not shown at all: even their names are already information.", "At the top — “Continue where you stopped”: the last product with a story and the last container graph. This is the most frequent path, and it needs no choice.", "The same list opens with the arrow next to the enterprise in the breadcrumbs, without coming back to this screen.", "An administrator sees the way into organization administration under the cards (7.1); other users do not have it."]],
  "3.1": ["The enterprise’s story map", ["The full user story map: a business area’s card (yellow) stands over its first stage, as on a paper map; stages (blue) go from left to right with the stories under them, and release slices from top to bottom.", "Every story shows its product, initiative (a flag), lifecycle state and the progress of its plan steps.", "An enterprise may have hundreds of products, so the left panel holds only <b>mine</b> (where I am the owner), <b>pinned</b> and <b>recent</b>, and the “All products · 176” row leads to a list with search and filters.", "A click on a story opens its panel on the right without leaving the map."]],
  "3.2": ["Landscape · C1 System Landscape", ["With hundreds of Software Systems a flat diagram cannot be read, so the landscape by default is <b>groups by business area</b> in the same order as the map’s backbone. A group is not stored: it is derived from the Software System’s stories.", "A product with stories in two areas stands in both — the fair price for nobody keeping the groups by hand. Software Systems without stories are gathered in “Off the map”, external ones in a separate group on the boundary.", "The thickness and the number on a link between groups show how many interfaces there are between their Software Systems. The links of a particular Software System are visible only once it is selected.", "A click on a group expands it (3.6). “List” shows all derived links as a table."]],
  "3.3": ["Initiatives", ["All initiatives of the enterprise: kind (PR/FAQ for now), state, author, how many stories are done. Products are derived from the initiative’s stories.", "The tabs at the top are the viewing mode: “Table” or “Board” (3.9). States, authors and products are the filter, on the left.", "A click opens the map with the initiative’s stories highlighted (3.5)."]],
  "3.4": ["Software Systems as a list", ["All Software Systems of the enterprise as a table — on the canvas, like a graph: zoom with the wheel, move by dragging, ⊡ shows everything.", "The tabs at the top are views with counts: all, digital products, external systems. The filter on the left: business area (derived from stories), owner, “mine only”.", "With hundreds of them this is the main way to find a Software System: search, sorting, pages, saved views."]],
  "3.5": ["Map with an initiative filter", ["The initiative’s stories stay bright, the others fade but do not disappear: it is visible where on the end-to-end process the initiative works.", "The filter is removed with the cross in the chip."]],
  "4.1": ["Product map", ["The same enterprise map, but with only this product’s stories. The backbone stays whole, so it is visible which part of the process the product falls into.", "The cells say how many stories other products have there: context without noise.", "On the left — the product’s containers with live, git and “shared” marks. A dive into a container’s graph is one click."]],
  "4.2": ["A story and its plan", ["The panel on the right: the story’s lifecycle, Software System, initiative, release slice, owner.", "The plan — steps, each with its container and status. A click on a step’s container dives into its graph: the most frequent dive in all of Maxitor.", "A step in another product’s container is marked: here the “Billing service” belongs to Billing. So the story’s cross-product impact is visible without a separate diagram."]],
  "4.3": ["The product’s context · C1 System Context", ["The product in the centre and all the Software Systems it is linked to — other products and external systems. The links are again derived from containers.", "A click on the centre goes down to C2, a click on a neighbouring product goes to its context: a move sideways."]],
  "4.4": ["The product’s containers · C2", ["Interfaces are drawn explicitly, as lollipops on the container’s left edge: a row is a published interface with its protocol. A filled circle means it is used (the number of consumers on the right), a hollow dashed one — <b>unused</b>.", "A link goes from the consumer straight into the lollipop, so the line needs no label. The flow goes from left to right: clients → services → data → neighbouring Software Systems. Orange lines are calls into other products, light ones are calls to us from outside.", "The filter on the left: used and unused, protocols, whose interface (inside the product, of other products, of external systems), expand or collapse all neighbours.", "Neighbouring Software Systems are collapsed into one node with those of their interfaces that concern the product; a click expands it to the containers."]],
  "4.5": ["Containers as a list", ["C2 as a table: what each container publishes and uses, which other products it is in, whether it has a live graph and a history in git, who the owner is."]],
  "4.6": ["The product’s initiatives", ["The same list of initiatives, only those that have stories of this product. The same view looks the same on different layers."]],
  "5": ["Container graph · C3", ["This is today’s Maxitor with its left panel: Applications, Domains, ERD, lifecycles. The only new thing in it is the shared header.", "Graph versions — <b>today’s mechanism</b>, unchanged: a button in the workspace row, a track of commits from git and Live, one version or a comparison of A and B (6.8, 6.10).", "The time button in the header shows catalog time here too: changes of the container’s record — owner, interfaces, products. It is a different time, so it is in a different place.", "The “C2: publishes · uses” chip goes back to the diagram of this container’s links."]],
  "6.1": ["Neighbours in the breadcrumbs", ["Every breadcrumb is a switcher: a click on the name goes up to the layer, the arrow opens the neighbours on the same layer.", "With hundreds of products the list starts with search, then mine, pinned and recent, and only then the whole list — the first rows and an “All 176 as a list” link.", "When switching products the open view is kept: looking at FSM’s C2 — you will see Billing’s C2."]],
  "6.2": ["⌘K search", ["Searches the whole enterprise: stories, containers, interfaces, initiatives, products. A choice jumps straight to the object, skipping the layers in between."]],
  "6.3": ["History track · enterprise", ["Not a list of PRs but <b>a chart of the volume of changes</b>: a bar is how many changes are in the interval. The precision stretches: hour, day, week, month; smoothly with the wheel or a pinch.", "What counts as a change depends on the open page: on the enterprise map — the whole map, at C1 — Software Systems and interfaces, on a product — only its objects. So the track differs from page to page.", "A click on a bar shows the changes of that interval; a click on a change opens the catalog at that moment (6.4)."]],
  "6.4": ["Viewing a past moment", ["Everything is read only: the time button and the strip under the header are yellow, and “Back to now” is always in sight.", "Every change saves the state of the whole catalog, so the selected moment acts on all layers: you can go down from the map to C2 and see them at the same minute."]],
  "3.6": ["Landscape: a group expanded", ["An expanded business area shows its Software Systems as tiles. The “also in: …” mark means the product is in other areas too.", "There are no links here: with dozens of Software Systems they would turn into a mess again. Choosing a Software System opens its context — only its own links (1-hop), like the 1-hop button in today’s Maxitor.", "The other Software Systems of the area — through the link to the list."]],
  "3.7": ["All products as a list", ["The “All products · 176” row from the left panel and from the breadcrumb switcher leads here: a table with the kind filter already on."]],
  "6.5": ["Room: who is where", ["“Open a room” is in the header on every level — from the enterprise picker to a container’s graph. A room belongs to the organization: only its member can enter, and the name comes from the account.", "The participants’ circles are in the header. A participant’s card says which level and view they are on and offers “Go to” and “Follow”.", "Pointers, shared filters and “never in a circle” stay as in today’s rooms (spec 028)."]],
  "6.6": ["Following a participant", ["The screen goes after the leader across layers: from their map to C2 and further into a container’s graph. The frame and the strip under the header are in the leader’s colour, and everyone keeps their own zoom.", "Stop with the button in the strip or with Esc. Your own move through the breadcrumbs also stops following."]],
  "6.7": ["Track · product, hourly precision", ["The same track on the product’s containers page: fewer changes, and only those of FSM’s containers and their interfaces. Hourly precision, the last two days."]],
  "6.8": ["Container graph versions", ["Today’s Maxitor track (specs 030, 051): the commits of the graph history on one axis, a big dot — the graph changed, a small one — only the version was raised, version numbers under the track, Live after the dashes.", "This is the time of the <b>code</b>. Catalog time stays in the header: they have different sources and answer different questions, so they are in two places, not one. Decided: the container layer keeps both."]],
  "6.9": ["A room at the organization level", ["A room works here too: you can choose an enterprise together and go down into it together.", "If the leader goes into a closed enterprise you have no access to, following stops with an explanation — a room does not open what is not yours."]],
  "4.7": ["Interfaces as a table", ["The same interfaces as the lollipops on the diagram, but as a table: name, protocol, publisher, whose it is, who uses it. Unused ones are marked at once.", "The filter on the left is shared with the diagram: switch a protocol off on the diagram — it is off here too.", "The table is on the canvas too: zoom with the wheel, move by dragging, ⊡ — show everything."]],
  "3.8": ["Stories as a table", ["A second point of view on the same map: stories as rows with business area, stage, release slice, state, product, initiative, owner and steps.", "The tabs at the top are the viewing mode. The filter on the left is the same as on the map and works in both modes."]],
  "3.9": ["Initiatives as a board", ["Initiatives in columns by lifecycle state: draft, approved, done, rejected. A card holds the author, the progress of stories, the products.", "The table and the board are two viewing modes of the same initiatives; the filter on the left is shared."]],
  "6.10": ["Comparing graph versions", ["The same track in comparison mode: a light A handle, a dark B, the dark segment is the selected interval. The button shows the changes on the graph, as Maxitor does today."]],
  "6.11": ["Container at a past snapshot", ["A past catalog moment is selected in the header. The code graph does not switch automatically, but a hint “v1.3.0 was in effect then →” appears next to the versions button.", "So the two time axes stay independent, and the link between them is one click."]],
};
function renderNotes() {
  const n = curNum();
  const note = NOTES[n];
  document.getElementById("cap").innerHTML = note ? `<b>${n} · ${note[0]}</b> — the screen is live: you can move through it` : "Free navigation through the mockup";
  document.getElementById("notes").innerHTML = note ? `<h2>${n} · ${note[0]}</h2><ul>${note[1].map(x => `<li>${x}</li>`).join("")}</ul>` : `<h2>Free navigation</h2><ul><li>This screen is not on the list on the left — you got here by moving through the mockup itself.</li></ul>`;
}
function fit() {
  const stage = document.getElementById("stage"), sc = document.getElementById("scale"), box = document.getElementById("box");
  const k = Math.min(1, (stage.clientWidth - 48) / 1360);
  sc.style.transform = `scale(${k})`; box.style.height = 840 * k + "px"; FS = k;
}
window.addEventListener("resize", fit);
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); if (!["signin", "invite", "picker", "admin"].includes(S.screen)) go({ pop: "cmdk" }); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !e.target.isContentEditable) { e.preventDefault(); undo(); }
  if (e.key === "Escape") go(S.follow && !S.pop ? { follow: null } : S.pop ? { pop: null } : { story: null, usr: null, ead: null, cedit: null, newIn: null, dnd: null, mob: false });
});
render();
</script>
