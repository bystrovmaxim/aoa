<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxitor rooms — mockup</title>
<style>
  /* Mockup page chrome. The screens themselves use Maxitor's own values (theme.ts, layoutConstants.ts). */
  :root {
    --page-bg: #e9edf1;
    --ink: #0f172a;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.1);
    --sidebar: #EBF2F5;
    --workspace: #f4f5f7;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--font); color: var(--ink); background: var(--page-bg); display: flex; }
  button { font: inherit; }

  /* ---- mockup navigation ---- */
  .nav { width: 290px; flex-shrink: 0; height: 100vh; overflow-y: auto; background: #fff; border-right: 1px solid var(--line); padding: 20px 14px 32px; }
  .nav h1 { font-size: 15px; margin: 0 6px 4px; }
  .nav .sub { font-size: 12px; color: var(--muted); margin: 0 6px 16px; line-height: 1.45; }
  .nav .group { font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 16px 6px 6px; }
  .nav button.screen { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 7px; font-size: 13px; color: var(--ink); cursor: pointer; }
  .nav button.screen:hover { background: rgba(15, 23, 42, 0.05); }
  .nav button.screen.on { background: rgba(15, 23, 42, 0.08); font-weight: 600; }
  .nav button.screen .n { color: var(--muted); font-size: 11px; min-width: 18px; font-variant-numeric: tabular-nums; }

  .stage { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; padding: 24px 28px 48px; }
  .frames { display: flex; gap: 28px; align-items: flex-start; }
  .frame-wrap { flex-shrink: 0; }
  .frame-cap { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .frame-cap b { color: var(--ink); }
  .frame-scale { transform-origin: top left; }
  .notes { max-width: 860px; margin-top: 22px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
  .notes h2 { font-size: 16px; margin: 0 0 4px; }
  .notes .ref { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .notes p, .notes li { font-size: 13px; line-height: 1.55; }
  .notes ul { padding-left: 18px; margin: 6px 0 0; }
  .notes code { font-size: 12px; background: #f1f5f9; padding: 1px 4px; border-radius: 4px; }

  /* ---- device frames ---- */
  .device { position: relative; background: #fff; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.08), 0 8px 28px rgba(15,23,42,.12); }
  .device.desktop { border-radius: 10px; display: flex; }
  .device.phone { border-radius: 34px; border: 10px solid #111827; display: flex; flex-direction: column; }

  /* ---- Maxitor: left sidebar ---- */
  .sb { width: 255px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid rgba(15,23,42,.08); display: flex; flex-direction: column; }
  .sb-head { height: 38px; padding: 4px 4px 2px; display: flex; gap: 0; align-items: center; }
  .icon-btn { width: 32px; height: 32px; border: 0; background: none; border-radius: 8px; color: rgb(100,116,139); display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .icon-btn svg { width: 20px; height: 20px; }
  .sb-row { display: flex; align-items: center; gap: 6px; height: 31px; padding: 0 10px; margin: 0 6px; border-radius: 6px; font-size: 13px; color: rgb(30,41,59); white-space: nowrap; }
  .sb-row.l1 { font-weight: 500; margin-top: 2px; }
  .sb-row.l2 { padding-left: 36px; }
  .sb-row.sel { background: rgba(15,23,42,.09); }
  .sb-row svg { width: 16px; height: 16px; color: rgb(100,116,139); flex-shrink: 0; }

  /* ---- Maxitor: main column ---- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* The new top row: same surface as the workspace, a hairline instead of a bar (issue §7). */
  .toprow { height: 38px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 14px; background: var(--workspace); border-bottom: 1px solid rgba(15,23,42,.06); position: relative; z-index: 60; }
  .toprow .spacer { flex: 1; }
  .phonebar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 4px; background: var(--sidebar); border-bottom: 1px solid rgba(15,23,42,.08); position: relative; z-index: 60; }
  .phonebar .spacer { flex: 1; }
  .phonebar .icon-btn { width: 44px; height: 44px; }
  .phonebar .icon-btn svg { width: 18px; height: 18px; }
  .phonebar .icon-btn.on { background: rgba(15,23,42,.08); color: #0f172a; }

  /* Left panel footer: project link, name and version, centred; the collapsed rail keeps only the link. */
  .sb-foot { margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px 12px; font-size: 11.5px; color: rgb(100,116,139); white-space: nowrap; }
  .sb-foot .gh { display: inline-flex; width: 20px; height: 20px; align-items: center; justify-content: center; color: rgb(71,85,105); }
  .sb-foot .gh svg { width: 16px; height: 16px; }
  .sb-foot .nm { font-weight: 600; color: rgb(30,41,59); }
  .sb.rail { width: 48px; }
  .sb.rail .sb-head { justify-content: center; }
  .sb.rail .sb-foot { justify-content: center; padding: 10px 0 12px; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #475569; font-size: 12.5px; font-weight: 500; cursor: default; white-space: nowrap; }
  .ghost svg { width: 14px; height: 14px; }
  .ghost.primary { color: #0f172a; background: rgba(15,23,42,.06); }
  .ghost.hover { background: rgba(15,23,42,.08); color: #0f172a; }
  .vsep { width: 1px; height: 18px; background: rgba(15,23,42,.12); margin: 0 2px; }

  .circles { display: flex; align-items: center; gap: 4px; }
  .av { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; letter-spacing: .01em; position: relative; flex-shrink: 0; user-select: none; }
  .av.me { box-shadow: 0 0 0 2px var(--workspace), 0 0 0 3.5px currentColor; }
  .av.away::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: #cbd5e1; border: 2px solid var(--workspace); }
  .av.more { background: #e2e8f0; color: #334155; }
  .phonebar .av { width: 30px; height: 30px; font-size: 12px; }
  .phonebar .av.me { box-shadow: 0 0 0 2px var(--sidebar), 0 0 0 3.5px currentColor; }

  /* ---- Maxitor: workspace ---- */
  .ws { flex: 1; min-height: 0; position: relative; overflow: hidden; background-color: var(--workspace);
        background-image: radial-gradient(rgba(160,168,180,.42) 1px, transparent 1px); background-size: 20px 20px; }
  .ws > svg.diagram { position: absolute; inset: 0; width: 100%; height: 100%; }
  .legend { position: absolute; top: 12px; left: 12px; z-index: 40; display: flex; flex-direction: column; gap: 6px; padding: 10px; min-width: 132px;
            background: rgba(255,255,255,.88); backdrop-filter: blur(8px); border: 1px solid rgba(0,0,0,.08); border-radius: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
  .legend .t { font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: rgba(0,0,0,.6); display: flex; align-items: center; gap: 4px; }
  .legend .t svg { width: 14px; height: 14px; }
  .legend .row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .legend .row.off { opacity: .4; }
  .legend .row.off span { text-decoration: line-through; }
  .legend .disk { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .legend .disk svg { width: 12px; height: 12px; }
  .legend .changed { margin-top: 2px; font-size: 10.5px; color: #475569; display: flex; align-items: center; gap: 5px; }
  .zoombar { position: absolute; bottom: 10px; left: 10px; z-index: 40; display: flex; align-items: center; gap: 6px; }
  .zoombar .z { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; color: #64748b; font-size: 15px; font-weight: 500; border-radius: 8px; }
  .zoombar .pct { font-size: 11px; color: #64748b; min-width: 3.1em; text-align: center; font-variant-numeric: tabular-nums; padding: 0 6px 0 4px; }
  .zoombar .mode { width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; color: #64748b; border-radius: 6px; }
  .zoombar .mode.on { background: rgba(15,23,42,.08); color: #0f172a; }
  .zoombar .mode svg { width: 16px; height: 16px; }
  .zoombar .hop { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #334155; margin-left: 6px; }
  .zoombar .hop i { width: 14px; height: 14px; border-radius: 3px; background: #1976d2; display: inline-flex; align-items: center; justify-content: center; }
  .phone .zoombar .z { width: 44px; height: 44px; }

  /* ---- room overlays ---- */
  .ptr { position: absolute; z-index: 50; pointer-events: none; }
  .ptr svg { display: block; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .ptr .lbl { position: absolute; left: 14px; top: 16px; padding: 2px 7px; border-radius: 9px; font-size: 11px; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .touch { position: absolute; z-index: 50; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 3px solid; pointer-events: none; }
  .touch .lbl { position: absolute; left: 30px; top: 22px; }
  .edge-arrow { position: absolute; z-index: 55; width: 30px; height: 30px; margin: -15px 0 0 -15px; }
  .edge-arrow .av { width: 26px; height: 26px; position: absolute; left: 2px; top: 2px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .edge-arrow .tip { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-origin: 0 0; }
  .edge-arrow .tip::before { content: ""; position: absolute; left: 14px; top: -6px; border-left: 8px solid var(--c); border-top: 6px solid transparent; border-bottom: 6px solid transparent; }

  .follow-frame { position: absolute; inset: 0; z-index: 58; border: 3px solid; pointer-events: none; }
  .follow-pill { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 59; display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 10px; border-radius: 14px; font-size: 12px; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .phone .follow-pill { top: auto; bottom: 64px; }
  .follow-pill .stop { border: 0; border-radius: 10px; padding: 3px 9px; font-size: 11.5px; font-weight: 600; background: rgba(255,255,255,.25); color: inherit; }

  .banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 59; display: flex; align-items: center; gap: 10px; max-width: calc(100% - 24px); padding: 9px 10px 9px 12px; border-radius: 8px; font-size: 12.5px; line-height: 1.4; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .banner svg { width: 18px; height: 18px; flex-shrink: 0; }
  .banner.warn { background: #fffbeb; border: 1px solid #fcd34d; color: #78350f; }
  .banner.info { background: #fff; border: 1px solid rgba(15,23,42,.12); color: #1e293b; }
  .banner.err { background: #fef2f2; border: 1px solid #fca5a5; color: #7f1d1d; }
  .banner .act { border: 0; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 600; background: rgba(15,23,42,.08); color: inherit; white-space: nowrap; }
  .phone .banner { top: 10px; width: calc(100% - 20px); }

  /* Cards, popovers and dialogs follow Maxitor's sidebar form: slate text, small uppercase labels,
     the outlined input of "AOA Service URL", and quiet buttons like the zoom bar. No blue accent. */
  .pop, .dialog { background: #fff; border: 1px solid rgba(15,23,42,.1); border-radius: 8px; box-shadow: 0 8px 30px rgba(15,23,42,.14), 0 1px 2px rgba(15,23,42,.06); color: rgb(30,41,59); }
  .pop { position: absolute; z-index: 70; font-size: 12.5px; }
  .label-caps { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgb(100,116,139); }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; border: 0; border-radius: 8px; padding: 0 12px; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .btn svg { width: 14px; height: 14px; }
  .btn.ghost-btn { background: transparent; color: #64748b; }
  .btn.quiet { background: rgba(15,23,42,.08); color: #0f172a; font-weight: 600; }
  .btn[disabled] { opacity: .45; }
  .pop .who { display: flex; gap: 10px; align-items: center; }
  .pop .who .av { width: 30px; height: 30px; font-size: 11.5px; }
  .pop .nm { font-weight: 600; font-size: 13px; }
  .pop .pg { color: rgb(100,116,139); font-size: 12px; margin-top: 1px; }
  .pop .pg b { font-weight: 600; color: rgb(71,85,105); }
  .pop .hint { color: rgb(100,116,139); font-size: 11.5px; line-height: 1.45; }
  .pop .acts { display: flex; gap: 4px; margin-top: 10px; margin-left: -6px; }
  .field { border: 1px solid rgba(15,23,42,.18); border-radius: 4px; background: rgba(255,255,255,.7); padding: 7px 10px; font-size: 12.5px; color: rgb(30,41,59); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field.focus { border-color: rgba(15,23,42,.45); }
  .field.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: rgb(71,85,105); }
  .field .caret { display: inline-block; width: 1px; height: 15px; background: rgb(30,41,59); margin-left: 1px; vertical-align: -3px; }
  .pop .linkbox { display: flex; gap: 6px; align-items: center; }
  .pop .linkbox .field { flex: 1; min-width: 0; }
  .pop .list-row { display: flex; align-items: center; gap: 9px; padding: 6px 4px; border-radius: 6px; }
  .pop .list-row .av { width: 24px; height: 24px; font-size: 10px; }
  .pop .list-row .pg { margin: 0; margin-left: auto; font-size: 11.5px; }
  .pop .menu-row { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; font-size: 13px; color: rgb(30,41,59); }
  .pop .menu-row svg { width: 16px; height: 16px; color: rgb(100,116,139); }

  .scrim { position: absolute; inset: 0; z-index: 80; background: rgba(15,23,42,.18); display: flex; align-items: center; justify-content: center; }
  .dialog { width: 340px; max-width: calc(100% - 24px); padding: 16px; }
  .dialog .dlg-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .dialog .lead { margin: 0 0 14px; font-size: 12.5px; color: rgb(71,85,105); line-height: 1.45; }
  .dialog .label-caps { margin-bottom: 6px; }
  .dialog .help { font-size: 11.5px; color: rgb(100,116,139); margin-top: 6px; line-height: 1.45; display: flex; justify-content: space-between; gap: 12px; }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 16px; }
  .dialog .here { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: rgba(15,23,42,.04); border-radius: 6px; font-size: 12.5px; color: rgb(30,41,59); margin-bottom: 14px; }
  .dialog .here .av { width: 22px; height: 22px; font-size: 10px; }

  .callout { position: absolute; z-index: 90; background: #fde047; color: #422006; font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 4px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
</style>
</head>
<body>
<nav class="nav" id="nav">
  <h1>Maxitor rooms</h1>
  <p class="sub">Design mockup for issue #271. Every screen uses Maxitor's own sizes and colours; the diagrams are simplified stand-ins. Screens follow the walk-through in §3 of the issue.</p>
</nav>
<main class="stage">
  <div class="frames" id="frames"></div>
  <section class="notes" id="notes"></section>
</main>

<script>
// ---------------------------------------------------------------------------
// Data: participants, diagram stand-ins
// ---------------------------------------------------------------------------

/** Server-assigned colours: distinct from the domain colours of the diagrams, readable on light and dark. */
const PEOPLE = {
  anna:  { name: "Anna",          color: "#E11D48" },
  boris: { name: "Boris",         color: "#0891B2" },
  vera:  { name: "Vera Ilina",    color: "#C026D3" },
  gleb:  { name: "Gleb",          color: "#EA580C" },
  dina:  { name: "Dina",          color: "#65A30D" },
  egor:  { name: "Egor Sokolov",  color: "#4338CA" },
  zoya:  { name: "Zoya",          color: "#DB2777" },
  ilya:  { name: "Ilya",          color: "#92400E" },
};

const PAGES = { erd: "ERD · all domains", graph: "Full graph", uc: "Use case · PlayersDomain" };

const DOMAINS = [
  { key: "events",    label: "events",    color: "#3b82f6" },
  { key: "offers",    label: "offers",    color: "#8b5cf6" },
  { key: "players",   label: "players",   color: "#10b981" },
  { key: "showcases", label: "showcases", color: "#f59e0b" },
];
const DOMAIN_COLOR = Object.fromEntries(DOMAINS.map((d) => [d.key, d.color]));

const TABLES = [
  { id: "player", name: "PlayerCoreEntity", d: "players", lr: [40, 40], tb: [40, 40],
    f: [["id", "str", "PK"], ["external_id", "str"], ["lifecycle", "PlayerLifecycle"], ["region", "str | None"], ["username", "str"], ["showcase", "ShowcaseCoreEntity", "FK"]] },
  { id: "gender", name: "GenderEnumEntity", d: "players", lr: [40, 270], tb: [40, 270],
    f: [["id", "str", "PK"], ["is_obsolete", "bool"]] },
  { id: "uevent", name: "UserEventCoreEntity", d: "events", lr: [360, 40], tb: [340, 40],
    f: [["id", "str", "PK"], ["kind", "EventKindEnumEntity", "FK"], ["external_event_id", "str"], ["created_at", "datetime"], ["player", "PlayerCoreEntity", "FK"], ["showcase", "ShowcaseCoreEntity", "FK"]] },
  { id: "login", name: "UserEventLoginSpecEntity", d: "events", lr: [360, 270], tb: [340, 270],
    f: [["id", "str", "PK"], ["platform", "PlatformEnumEntity", "FK"], ["ip", "str"], ["streak_days", "int"]] },
  { id: "showcase", name: "ShowcaseCoreEntity", d: "showcases", lr: [680, 40], tb: [640, 40],
    f: [["id", "str", "PK"], ["name", "str"], ["public_key", "str"], ["created_at", "datetime"]] },
  { id: "offer", name: "OfferCoreEntity", d: "offers", lr: [680, 220], tb: [940, 40],
    f: [["id", "str", "PK"], ["active_from", "datetime"], ["active_to", "datetime"], ["adult_only", "bool"], ["advertiser", "AdvertiserCoreEntity", "FK"]] },
  { id: "adv", name: "AdvertiserCoreEntity", d: "offers", lr: [680, 390], tb: [940, 230],
    f: [["id", "str", "PK"], ["name", "str"]] },
];
const RELATIONS = [["uevent", "player"], ["login", "uevent", "gen"], ["player", "gender"], ["uevent", "showcase"], ["player", "showcase"], ["offer", "adv"]];
const TW = 250, TH_HEAD = 30, TH_ROW = 20;
const tableH = (t) => TH_HEAD + t.f.length * TH_ROW + 6;

/** Diagram-coordinate bounds of each stand-in, for "fit". */
const BOUNDS = { erd_lr: [0, 0, 970, 480], erd_tb: [0, 0, 1230, 440], graph: [0, 0, 900, 640] };

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------

function initials(name) {
  const words = name.trim().split(/\s+/);
  return (words.length > 1 ? words[0][0] + words[1][0] : words[0].slice(0, 2)).toUpperCase();
}

/** Text colour for a filled circle: dark on light fills, white on dark ones. */
function inkOn(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((c) => {
    c /= 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.4 ? "#0f172a" : "#ffffff";
}

function av(pid, extra = "") {
  const p = PEOPLE[pid];
  return `<span class="av ${extra}" style="background:${p.color};color:${inkOn(p.color)}">${initials(p.name)}</span>`;
}

const I = {
  panel: '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.38" stroke-linejoin="round" d="M4.75 5.75h14.5c.55 0 1 .45 1 1v10.5c0 .55-.45 1-1 1H4.75c-.55 0-1-.45-1-1V6.75c0-.55.45-1 1-1z"/><path fill="none" stroke="currentColor" stroke-width="1.38" stroke-linecap="round" d="M9.25 6.25v11.5"/></svg>',
  swap: '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.38" stroke-linecap="round" stroke-linejoin="round" d="M4.75 8h14.5M15.75 5l3 3-3 3M19.25 16H4.75M8.25 13l-3 3 3 3"/></svg>',
  reload: '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.38" stroke-linecap="round" stroke-linejoin="round" d="M19.25 12a7.25 7.25 0 1 1-2.12-5.13M19.25 4.75v4h-4"/></svg>',
  chevR: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>',

/** Footer of the left panel: the project link always; the name and version when the panel is open. */
const PROJECT_URL = "https://github.com/bystrovmaxim/aoa/tree/main/packages/aoa-maxitor";

const MAXITOR_VERSION = "2.2.0";

// ---------------------------------------------------------------------------
// Diagram stand-ins, drawn in diagram coordinates
// ---------------------------------------------------------------------------

function erdSvg(layout, hidden) {
  const pos = (t) => t[layout];
  const shown = TABLES.filter((t) => !hidden.includes(t.d));
  const byId = Object.fromEntries(shown.map((t) => [t.id, t]));
  let out = '<defs><marker id="erd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>';
  for (const [a, b, kind] of RELATIONS) {
    if (!byId[a] || !byId[b]) continue;
    const [ax, ay] = pos(byId[a]), [bx, by] = pos(byId[b]);
    const ah = tableH(byId[a]), bh = tableH(byId[b]);
    let p;
    if (bx >= ax + TW) p = [ax + TW, ay + 15 + ah / 4, bx, by + 15 + bh / 4, "h"];
    else if (bx + TW <= ax) p = [ax, ay + 15 + ah / 4, bx + TW, by + 15 + bh / 4, "h"];
    else if (by > ay) p = [ax + TW / 2, ay + ah, bx + TW / 2, by, "v"];
    else p = [ax + TW / 2, ay, bx + TW / 2, by + bh, "v"];
    const [x1, y1, x2, y2, dir] = p;
    const c = dir === "h" ? `C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2}` : `C${x1},${(y1 + y2) / 2} ${x2},${(y1 + y2) / 2}`;
    out += `<path d="M${x1},${y1} ${c} ${x2},${y2}" fill="none" stroke="#94a3b8" stroke-width="1.3" ${kind === "gen" ? 'stroke-dasharray="5 3"' : ""} marker-end="url(#erd-arrow)"/>`;
  }
  for (const t of shown) {
    const [x, y] = pos(t), h = tableH(t), col = DOMAIN_COLOR[t.d];
    out += `<g><rect x="${x}" y="${y}" width="${TW}" height="${h}" rx="9" fill="#fff" stroke="${col}" stroke-width="1.4"/>`;
    out += `<path d="M${x} ${y + 9}a9 9 0 0 1 9-9h${TW - 18}a9 9 0 0 1 9 9v${TH_HEAD - 9}h-${TW}z" fill="${col}"/>`;
    out += `<text x="${x + 12}" y="${y + 20}" font-size="12.5" font-weight="600" fill="#fff">${t.name}</text>`;
    t.f.forEach(([name, type, key], i) => {
      const ry = y + TH_HEAD + 4 + i * TH_ROW;
      if (i % 2) out += `<rect x="${x + 1}" y="${ry}" width="${TW - 2}" height="${TH_ROW}" fill="${col}" fill-opacity=".06"/>`;
      if (key) out += `<text x="${x + 10}" y="${ry + 14}" font-size="8.5" font-weight="700" fill="${key === "PK" ? "#b45309" : "#475569"}">${key}</text>`;
      out += `<text x="${x + 32}" y="${ry + 14}" font-size="11" fill="#0f172a">${name}</text>`;
      out += `<text x="${x + TW - 10}" y="${ry + 14}" font-size="10" fill="#64748b" text-anchor="end">${type}</text>`;
    });
    out += "</g>";
  }
  return out;
}

/** A deterministic stand-in for the full graph: four domain clusters with bubble hulls around one application node. */
const GRAPH = (() => {
  let seed = 7;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
  const clusters = [
    { label: "EventsDomain", color: "#3b82f6", cx: 220, cy: 190 },
    { label: "OffersDomain", color: "#8b5cf6", cx: 640, cy: 170 },
    { label: "PlayersDomain", color: "#10b981", cx: 230, cy: 470 },
    { label: "ShowcasesDomain", color: "#f59e0b", cx: 650, cy: 470 },
  ];
  const nodes = [{ x: 440, y: 320, fill: "#000000" }], edges = [];
  for (const c of clusters) {
    const hub = nodes.push({ x: c.cx, y: c.cy, fill: "#377EB8" }) - 1;
    edges.push([0, hub]);
    for (let e = 0; e < 4; e++) {
      const a = (e / 4) * Math.PI * 2 + rnd() * 0.6;
      const ent = nodes.push({ x: c.cx + Math.cos(a) * 58, y: c.cy + Math.sin(a) * 58, fill: "#1B9E77" }) - 1;
      edges.push([hub, ent]);
      const k = 3 + Math.floor(rnd() * 3);
      for (let f = 0; f < k; f++) {
        const b = a + (f - (k - 1) / 2) * 0.32;
        const r = 100 + rnd() * 16;
        const fld = nodes.push({ x: c.cx + Math.cos(b) * r, y: c.cy + Math.sin(b) * r, fill: f % 2 ? "#5AB4AC" : "#6B5B95" }) - 1;
        edges.push([ent, fld]);
      }
    }
    const act = nodes.push({ x: c.cx + (c.cx < 440 ? 1 : -1) * 130, y: c.cy + (c.cy < 320 ? 1 : -1) * 70, fill: "#4F46E5" }) - 1;
    edges.push([act, hub]);
  }
  return { clusters, nodes, edges };
})();

function graphSvg() {
  let out = '<defs><marker id="g-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#95a5a6"/></marker></defs>';
  for (const c of GRAPH.clusters) {
    out += `<circle cx="${c.cx}" cy="${c.cy}" r="138" fill="${c.color}" fill-opacity=".14" stroke="${c.color}" stroke-opacity=".55" stroke-width="1.5"/>`;
  }
  for (const [a, b] of GRAPH.edges) {
    const n1 = GRAPH.nodes[a], n2 = GRAPH.nodes[b];
    const dx = n2.x - n1.x, dy = n2.y - n1.y, L = Math.hypot(dx, dy) || 1;
    out += `<line x1="${n1.x}" y1="${n1.y}" x2="${n2.x - (dx / L) * 8}" y2="${n2.y - (dy / L) * 8}" stroke="#95a5a6" stroke-width="1.1" marker-end="url(#g-arrow)"/>`;
  }
  for (const n of GRAPH.nodes) {
    out += `<circle cx="${n.x}" cy="${n.y}" r="7" fill="${n.fill}" stroke="rgba(15,23,42,.14)" stroke-width="1"/><circle cx="${n.x}" cy="${n.y}" r="2.2" fill="#fff" fill-opacity=".85"/>`;
  }
  for (const c of GRAPH.clusters) {
    const w = c.label.length * 6.4 + 12;
    out += `<rect x="${c.cx - w / 2}" y="${c.cy - 150}" width="${w}" height="18" rx="5" fill="${c.color}"/><text x="${c.cx}" y="${c.cy - 137}" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">${c.label}</text>`;
  }
  return out;
}

// ---------------------------------------------------------------------------
// Device rendering
// ---------------------------------------------------------------------------

const DESKTOP = { w: 1180, h: 700 };
const PHONE = { w: 375, h: 760 };

/** Workspace size of a device in CSS pixels (phone sizes are inside the 10 px bezel). */
function wsSize(cfg) {
  if (cfg.kind === "phone") return { w: PHONE.w - 20, h: PHONE.h - 20 - 44 };
  return { w: DESKTOP.w - (cfg.collapsed ? 48 : 255), h: DESKTOP.h - 38 };
}

function boundsOf(cfg) {
  return cfg.page === "graph" ? BOUNDS.graph : cfg.layout === "tb" ? BOUNDS.erd_tb : BOUNDS.erd_lr;
}

/** The view transform: fit the diagram, then optionally zoom further and centre on a diagram point. */
function viewOf(cfg) {
  const ws = wsSize(cfg);
  const [x0, y0, x1, y1] = boundsOf(cfg);
  const pad = cfg.kind === "phone" ? 16 : 40;
  // On a desktop the floating legend takes the left edge, so the fitted picture starts to its right.
  const left = cfg.kind === "phone" ? 0 : 150;
  const k = Math.min((ws.w - left - pad * 2) / (x1 - x0), (ws.h - pad * 2 - 40) / (y1 - y0)) * (cfg.zoom ?? 1);
  const center = cfg.center ?? [(x0 + x1) / 2, (y0 + y1) / 2];
  const tx = left + (ws.w - left) / 2 - center[0] * k, ty = (ws.h - 30) / 2 - center[1] * k + (cfg.kind === "phone" ? 0 : 10);
  return { k, tx, ty, ws };
}

function sidebar(cfg) {
  const gh = `<a class="gh" href="${PROJECT_URL}" target="_blank" rel="noopener" title="Maxitor on GitHub">${I.github}</a>`;
  if (cfg.collapsed) {
    return `<aside class="sb rail"><div class="sb-head"><span class="icon-btn">${I.panel}</span></div><div class="sb-foot">${gh}</div></aside>`;
  }
  const sel = cfg.page;
  const row = (cls, icon, text) => `<div class="sb-row ${cls}">${icon}${text}</div>`;
  return `<aside class="sb">
    <div class="sb-head"><span class="icon-btn">${I.panel}</span><span class="icon-btn">${I.swap}</span><span class="icon-btn">${I.reload}</span></div>
    ${row("l1", I.chevD, "Applications")}
    ${row("l2" + (sel === "graph" ? " sel" : ""), I.graph, "Full graph view")}
    ${row("l1", I.chevD, "Domains")}
    ${row("l2" + (sel === "erd" ? " sel" : ""), I.table, "Entity all domains view")}
    ${row("l2", I.chevR, "EventsDomain")}
    ${row("l2", I.chevR, "OffersDomain")}
    ${row("l2", I.chevR, "PlayersDomain")}
    ${row("l2", I.chevR, "ShowcasesDomain")}
    ${row("l1", I.chevR, "Roles")}
    ${row("l1", I.chevR, "Actions")}
    ${row("l1", I.chevR, "Entities")}
    ${row("l1", I.chevR, "Resources")}
    <div class="sb-foot">${gh}<span class="nm">Maxitor</span><span>${MAXITOR_VERSION}</span></div>
  </aside>`;
}

/** Circles: own first; beyond the limit (5 desktop, 3 phone) the rest collapse into +N. */
function circles(cfg) {
  const limit = cfg.kind === "phone" ? 3 : 5;
  const ids = [cfg.me, ...cfg.room.filter((p) => p !== cfg.me)];
  const shown = ids.length > limit ? ids.slice(0, limit - 1) : ids;
  const rest = ids.length - shown.length;
  let html = shown.map((id) => {
    const away = cfg.pages?.[id] && cfg.pages[id] !== cfg.page ? " away" : "";
    return av(id, (id === cfg.me ? "me" : "") + away).replace('class="av', `data-pid="${id}" style="color:${PEOPLE[id].color}" class="av`);
  }).join("");
  if (rest > 0) html += `<span class="av more" data-more>+${rest}</span>`;
  return `<span class="circles">${html}</span>`;
}

function topRow(cfg) {
  if (cfg.kind === "phone") {
    const inRoom = cfg.room?.length;
    return `<div class="phonebar"><span class="icon-btn">${I.menu}</span><span class="spacer"></span>${
      inRoom
        ? `${circles(cfg)}<span class="icon-btn${cfg.roomMenu ? " on" : ""}" title="Room">${I.dots}</span>`
        : `<span class="ghost primary">${I.people}Open room</span>`
    }</div>`;
  }
  if (!cfg.room?.length) {
    return `<div class="toprow"><span class="spacer"></span><span class="ghost primary${cfg.hoverOpen ? " hover" : ""}">${I.people}Open room</span></div>`;
  }
  return `<div class="toprow"><span class="spacer"></span>${circles(cfg)}<span class="vsep"></span>
    <span class="ghost${cfg.share ? " hover" : ""}" data-copy>${I.link}Copy link</span>
    <span class="ghost">${I.leave}Leave room</span></div>`;
}

function legend(cfg) {
  if (cfg.page === "graph") {
    const types = [["Application", "#000000"], ["Domain", "#377EB8"], ["Entity", "#1B9E77"], ["EntityField", "#5AB4AC"], ["Field", "#6B5B95"], ["Action", "#4F46E5"]];
    if (cfg.kind === "phone") return `<div class="legend"><div class="t">${I.chevR}Node types</div></div>`;
    return `<div class="legend"><div class="t">Node types</div>${types.map(([t, c]) => `<div class="row"><span class="disk" style="background:${c}"></span><span>${t}</span></div>`).join("")}</div>`;
  }
  const hidden = cfg.hidden ?? [];
  if (cfg.kind === "phone") {
    const off = hidden.length ? ` · ${hidden.length} off` : "";
    return `<div class="legend"><div class="t">${I.chevR}Domains${off}</div></div>`;
  }
  return `<div class="legend"><div class="t">${I.chevD}Domains</div>${DOMAINS.map((d) =>
    `<div class="row${hidden.includes(d.key) ? " off" : ""}"><span class="disk" style="background:${d.color}">${I.cube}</span><span>${d.label}</span></div>`).join("")}
    ${cfg.changedBy ? `<div class="changed">${av(cfg.changedBy).replace('class="av', 'style="width:14px;height:14px;font-size:7px" class="av')}${PEOPLE[cfg.changedBy].name} changed this</div>` : ""}
    <div class="t">${I.chevR}Kinds</div></div>`;
}

function zoomBar(cfg, k) {
  const pct = Math.round(k * 100) + "%";
  const zoom = `<span class="z">+</span><span class="z">−</span><span class="z">⊡</span><span class="pct">${pct}</span>`;
  if (cfg.kind === "phone" || cfg.page === "graph") return `<div class="zoombar">${zoom}</div>`;
  const modes = [["lr", I.modeLR], ["tb", I.modeTB], ["neato", I.modeNeato], ["fdp", I.modeFdp], ["circo", I.modeCirco]];
  return `<div class="zoombar">${zoom}<span class="vsep"></span>${modes.map(([m, ic]) => `<span class="mode${(cfg.layout ?? "lr") === m ? " on" : ""}">${ic}</span>`).join("")}<span class="hop"><i>${I.check}</i>1-hop</span></div>`;
}

/** A remote pointer: inside the view as an arrow with a name, outside as an edge arrow (issue §8). */
function pointer(cfg, v, p) {
  const person = PEOPLE[p.pid];
  const sx = p.x * v.k + v.tx, sy = p.y * v.k + v.ty;
  const fg = inkOn(person.color);
  const inset = 20;
  if (sx < 0 || sy < 0 || sx > v.ws.w || sy > v.ws.h) {
    const cx = v.ws.w / 2, cy = v.ws.h / 2;
    const dx = sx - cx, dy = sy - cy;
    const s = Math.min((cx - inset) / Math.abs(dx || 1e-6), (cy - inset) / Math.abs(dy || 1e-6));
    const ex = cx + dx * s, ey = cy + dy * s;
    const angle = (Math.atan2(dy, dx) * 180) / Math.PI;
    return `<div class="edge-arrow" style="left:${ex}px;top:${ey}px;--c:${person.color}"><span class="tip" style="transform:rotate(${angle}deg)"></span>${av(p.pid)}</div>`;
  }
  const label = `<span class="lbl" style="background:${person.color};color:${fg}">${person.name}</span>`;
  if (p.touch) {
    return `<div class="touch" style="left:${sx}px;top:${sy}px;border-color:${person.color};background:${person.color}2e">${label}</div>`;
  }
  return `<div class="ptr" style="left:${sx - 2}px;top:${sy - 2}px"><svg width="18" height="22" viewBox="0 0 18 22"><path d="M2 2v16l4.4-4.1 3 6.6 2.9-1.3-3-6.5H16z" fill="${person.color}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>${label}</div>`;
}

function workspace(cfg) {
  const v = viewOf(cfg);
  const body = cfg.page === "graph" ? graphSvg() : erdSvg(cfg.layout === "tb" ? "tb" : "lr", cfg.hidden ?? []);
  let html = `<div class="ws"><svg class="diagram"><g transform="translate(${v.tx} ${v.ty}) scale(${v.k})" font-family="ui-sans-serif, system-ui, sans-serif">${body}</g></svg>`;
  html += legend(cfg) + zoomBar(cfg, v.k);
  for (const p of cfg.pointers ?? []) html += pointer(cfg, v, p);
  if (cfg.follow) {
    const p = PEOPLE[cfg.follow];
    html += `<div class="follow-frame" style="border-color:${p.color}"></div>
      <div class="follow-pill" style="background:${p.color};color:${inkOn(p.color)}">Following ${p.name}<button class="stop">Stop</button></div>`;
  }
  if (cfg.banner) html += cfg.banner;
  for (const c of cfg.callouts ?? []) html += `<div class="callout" style="left:${c.x}px;top:${c.y}px">${c.text}</div>`;
  return html + "</div>";
}

function device(cfg) {
  const size = cfg.kind === "phone" ? PHONE : DESKTOP;
  const main = `<div class="main">${topRow(cfg)}${workspace(cfg)}</div>`;
  const inner = cfg.kind === "phone" ? main : sidebar(cfg) + main;
  return `<div class="device ${cfg.kind}" style="width:${size.w}px;height:${size.h}px">${inner}${cfg.overlay ?? ""}</div>`;
}

/**
 * The card of another participant. ``mode`` is "follow" (a plain Follow), "switch" (you already
 * follow someone else) or "loop" (they follow you, directly or through others, so Follow is refused).
 */
function personTooltip({ pid, right, top, page, mode = "follow", followsYou }) {
  const p = PEOPLE[pid];
  const first = p.name.split(" ")[0];
  const followBtn = {
    follow: `<button class="btn quiet">Follow</button>`,
    switch: `<button class="btn quiet">Follow ${first} instead</button>`,
    loop: `<button class="btn quiet" disabled>Follow</button>`,
  }[mode];
  const hint = {
    follow: "A click on the circle goes there too. Your zoom stays yours.",
    switch: "You stop following the other person and follow " + first + " from now on.",
    loop: `${first} is following you, so you can't follow ${first}: your screens would chase each other.`,
  }[mode];
  return `<div class="pop" style="right:${right}px;top:${top}px;width:260px;padding:12px">
    <div class="who">${av(pid)}<div><div class="nm">${p.name}</div><div class="pg">${PAGES[page]}${followsYou ? " · <b>following you</b>" : ""}</div></div></div>
    <div class="acts"><button class="btn ghost-btn">Go to ${first}</button>${followBtn}</div>
    <div class="hint" style="margin-top:6px">${hint}</div>
  </div>`;
}

function overflowList(cfg, ids, pages) {
  return `<div class="pop" style="right:150px;top:36px;width:280px;padding:8px">
    <div class="hint" style="padding:2px 4px 6px">${ids.length} more in this room</div>
    ${ids.map((id) => `<div class="list-row">${av(id)}<span class="nm" style="font-size:12.5px;font-weight:500">${PEOPLE[id].name}</span><span class="pg">${PAGES[pages[id]]}</span></div>`).join("")}
  </div>`;
}

function banner(kind, icon, text, action) {
  return `<div class="banner ${kind}">${icon}<span>${text}</span>${action ? `<button class="act">${action}</button>` : ""}</div>`;
}

// ---------------------------------------------------------------------------
// Page wiring
// ---------------------------------------------------------------------------

const nav = document.getElementById("nav");
const framesEl = document.getElementById("frames");
const notesEl = document.getElementById("notes");
let current = 1;
let n = 0;

for (let i = 0; i < SCREENS.length; i++) {
  const s = SCREENS[i];
  if (s.group) {
    nav.insertAdjacentHTML("beforeend", `<div class="group">${s.group}</div>`);
    continue;
  }
  n += 1;
  nav.insertAdjacentHTML("beforeend", `<button class="screen" data-i="${i}"><span class="n">${n}</span><span>${s.title}</span></button>`);
}
nav.addEventListener("click", (e) => {
  const b = e.target.closest("button.screen");
  if (b) show(+b.dataset.i);
});
document.addEventListener("keydown", (e) => {
  const order = SCREENS.map((s, i) => (s.group ? -1 : i)).filter((i) => i >= 0);
  const at = order.indexOf(current);
  if (e.key === "ArrowDown" || e.key === "ArrowRight") show(order[Math.min(at + 1, order.length - 1)]);
  if (e.key === "ArrowUp" || e.key === "ArrowLeft") show(order[Math.max(at - 1, 0)]);
});

function show(i) {
  current = i;
  const s = SCREENS[i];
  nav.querySelectorAll("button.screen").forEach((b) => b.classList.toggle("on", +b.dataset.i === i));
  framesEl.innerHTML = s.frames.map((f) => {
    const cfg = { room: [], ...f };
    const size = cfg.kind === "phone" ? PHONE : DESKTOP;
    return `<div class="frame-wrap" data-w="${size.w}" data-h="${size.h}"><p class="frame-cap">${cfg.cap}</p><div class="frame-scale">${device(cfg)}</div></div>`;
  }).join("");
  notesEl.innerHTML = `<h2>${s.title}</h2><div class="ref">Issue #271 ${s.ref}</div>${s.notes}`;
  fit();
}

/** Scale the frames down so the whole screen fits the stage width. */
function fit() {
  const wraps = [...framesEl.querySelectorAll(".frame-wrap")];
  const natural = wraps.reduce((sum, w) => sum + +w.dataset.w, 0) + 28 * (wraps.length - 1);
  const avail = framesEl.parentElement.clientWidth - 56;
  const k = Math.min(1, avail / natural);
  for (const w of wraps) {
    const inner = w.querySelector(".frame-scale");
    inner.style.transform = `scale(${k})`;
    inner.style.width = `${w.dataset.w}px`;
    w.style.width = `${w.dataset.w * k}px`;
    inner.parentElement.style.height = "";
    inner.style.height = `${w.dataset.h}px`;
    inner.style.marginBottom = `${w.dataset.h * (k - 1)}px`;
  }
}
window.addEventListener("resize", fit);
show(1);
</script>
