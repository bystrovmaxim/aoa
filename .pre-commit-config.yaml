# .pre-commit-config.yaml
# Конфигурация pre-commit хуков для проекта ActionMachine

repos:
  # ------------------------------------------------------------------------
  # Базовые хуки от pre-commit
  # ------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # обновлённая версия
    hooks:
      - id: trailing-whitespace
        description: "Удаляет пробелы в концах строк"

      - id: end-of-file-fixer
        description: "Добавляет пустую строку в конце файла"

      - id: check-yaml
        description: "Проверка синтаксиса YAML"
        args: [--allow-multiple-documents]

      - id: check-toml
        description: "Проверка синтаксиса TOML"

      - id: check-added-large-files
        description: "Проверка на файлы > 500KB"
        args: [--maxkb=500]

      - id: check-merge-conflict
        description: "Поиск незавершённых merge-конфликтов"

      - id: check-json
        description: "Проверка синтаксиса JSON"

      - id: check-case-conflict
        description: "Проверка case-sensitive конфликтов"

  # ------------------------------------------------------------------------
  # RUFF — супер-быстрый линтер и авто-исправление
  # ------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2  # must match the ruff version in uv.lock
    hooks:
      - id: ruff
        description: "Запуск линтера ruff с авто-исправлением"
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(packages/|tests/)

      - id: ruff-format
        description: "Форматирование кода через ruff"
        files: ^(packages/|tests/)

  # ------------------------------------------------------------------------
  # PYLINT — дополнительный линтер (локальный)
  # ------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        description: "Запуск pylint"
        entry: uv run pylint
        language: system
        files: ^packages/aoa-action-machine/
        types: [python]
        args: [
          "--rcfile=pyproject.toml",
          "--output-format=colorized"
        ]

  # ------------------------------------------------------------------------
  # Безопасность: поиск секретов в коде
  # ------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-no-secrets
        name: No secrets in tracked files
        entry: uv run --extra dev python scripts/check_no_secrets.py
        language: system
        pass_filenames: false
        always_run: true
