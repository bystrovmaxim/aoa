# packages/maxitor/pyproject.toml — publishable distribution ``maxitor``: one package from web/, tools/ and skills/, parts chosen by extras.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxitor"
version = "3.14.4"
description = "Maxitor: its web part and its tools, one package with extras."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "@Bystrov.Maxim" }]
# Every part's code is in the wheel; an extra brings one part's dependencies. The base install is
# the ``graph-builder`` command: jsonschema-rs decides whether a document is a graph (the demo's in 0.06 s,
# not 24 s); jsonschema explains a refusal on the one element jsonschema-rs stopped at.
dependencies = [
    "jsonschema>=4.17,<5",
    "jsonschema-rs>=0.60,<1",
]

[project.optional-dependencies]
# The repo-graph-port service: reads a graph's history from its repository and serves it.
repo-graph-port = [
    "aoa-action-machine>=1.0.1a0",
    "aoa-fastapi-adapter>=1.3.0",
    "uvicorn>=0.30",
    "PyJWT[crypto]>=2.8,<3",
    "httpx>=0.28,<1.0",
]
# The web part: Maxitor's server and its built web client.
web = [
    "aoa-action-machine>=1.0.1a0",
    "aoa-fastapi-adapter>=1.3.0",
    "duckdb>=1.5,<2",
    "httpx>=0.28,<1.0",
    "uvicorn>=0.30",
    "websockets>=15",
]
all = ["maxitor[web]", "maxitor[repo-graph-port]"]

[tool.uv.sources]
aoa-action-machine = { workspace = true }
aoa-fastapi-adapter = { workspace = true }

[project.urls]
Homepage = "https://github.com/action-machine/action-machine"
Documentation = "https://action-machine.readthedocs.io"
Repository = "https://github.com/action-machine/action-machine"

[project.scripts]
graph-builder = "maxitor.graph_builder.cli:main"
maxitor = "maxitor.web.launch:main"
repo-graph-port = "maxitor.repo_graph_port.launch:main"

# One package from several folders: the web part (maxitor-web/), the tools and services (tools/<name>/), the
# code they share (core/<name>/) and the skills (skills/). ``maxitor`` is a namespace package; each part keeps its code in ``<part>/maxitor/<name>/``.
[tool.hatch.build.targets.wheel]
only-include = ["maxitor-web/maxitor", "tools/repo-graph-port/maxitor", "tools/graph-builder/maxitor", "core/graph_compare/maxitor", "core/graph_map/maxitor"]
artifacts = ["maxitor-web/maxitor/web/static/**/*"]
dev-mode-dirs = ["maxitor-web", "tools/repo-graph-port", "tools/graph-builder", "core/graph_compare", "core/graph_map"]

[tool.hatch.build.targets.wheel.sources]
"maxitor-web" = ""
"tools/repo-graph-port" = ""
"tools/graph-builder" = ""
"core/graph_compare" = ""
"core/graph_map" = ""

[tool.hatch.build.targets.wheel.force-include]
"skills" = "maxitor/skills"

[tool.hatch.build.targets.sdist]
exclude = [
  "maxitor-web/client/node_modules",
  "maxitor-web/client/node_modules/**",
  "maxitor-web/client/.vite",
  "maxitor-web/client/.vite/**",
  # A service's saved graph is the repository's history, not the package's (graph-builder.toml).
  "maxitor-web/graph.json",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
