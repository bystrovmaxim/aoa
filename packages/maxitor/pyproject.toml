# packages/maxitor/pyproject.toml — publishable distribution ``maxitor``: one package from app/, tools/ and skills/, parts chosen by extras.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxitor"
version = "3.0.0"
description = "Maxitor: its front and its tools, one package with extras."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "@Bystrov.Maxim" }]
# Every part's code is in the wheel; an extra brings one part's dependencies. The base install is
# the ``graph-builder`` command: jsonschema-rs decides whether a document is a graph (the demo's in 0.06 s,
# not 24 s); jsonschema explains a refusal on the one element jsonschema-rs stopped at.
dependencies = [
    "jsonschema>=4.17,<5",
    "jsonschema-rs>=0.60,<1",
]

[project.optional-dependencies]
# The front: Maxitor's server and its built web client.
front = [
    "aoa-action-machine>=1.0.1a0",
    "aoa-fastapi-adapter>=1.3.0",
    "duckdb>=1.5,<2",
    "httpx>=0.28,<1.0",
    "uvicorn>=0.30",
    "websockets>=15",
]
all = ["maxitor[front]"]

[tool.uv.sources]
aoa-action-machine = { workspace = true }
aoa-fastapi-adapter = { workspace = true }

[project.urls]
Homepage = "https://github.com/action-machine/action-machine"
Documentation = "https://action-machine.readthedocs.io"
Repository = "https://github.com/action-machine/action-machine"

[project.scripts]
graph-builder = "maxitor.graph_builder.cli:main"
maxitor = "maxitor.front.launch:main"

# One package from several folders: the web part (front/), the tools (tools/<name>/) and the
# skills (skills/). ``maxitor`` is a namespace package; each part keeps its own ``src``.
[tool.hatch.build.targets.wheel]
only-include = ["front/src/maxitor", "tools/graph_builder/src/maxitor"]
artifacts = ["front/src/maxitor/front/static/**/*"]
dev-mode-dirs = ["front/src", "tools/graph_builder/src"]

[tool.hatch.build.targets.wheel.sources]
"front/src" = ""
"tools/graph_builder/src" = ""

[tool.hatch.build.targets.wheel.force-include]
"skills" = "maxitor/skills"

[tool.hatch.build.targets.sdist]
exclude = [
  "front/client/node_modules",
  "front/client/node_modules/**",
  "front/client/.vite",
  "front/client/.vite/**",
  # A service's saved graph is the repository's history, not the package's (graph-builder.toml).
  "front/graph.json",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
