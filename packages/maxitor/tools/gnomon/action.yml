# packages/maxitor/tools/gnomon/action.yml — the graph check as one CI step: `uses: bystrovmaxim/aoa/packages/maxitor/tools/gnomon@<ref>`.
name: Gnomon graph files are current
description: Rebuild every graph listed in gnomon.toml and fail when a saved graph file is stale, missing or broken.
author: Bystrov Maxim
branding:
  icon: check-circle
  color: blue

inputs:
  config:
    description: The config that lists the repository's graphs.
    required: false
    default: gnomon.toml
  sync:
    description: The command that installs the project's environment, in which the graph builds run; empty to skip.
    required: false
    default: uv sync --all-extras
  gnomon:
    description: How to run the command; empty runs the maxitor release this action belongs to.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5

    - name: Install the project's environment
      if: inputs.sync != ''
      shell: bash
      run: ${{ inputs.sync }}

    - name: Check the graph files
      shell: bash
      env:
        GNOMON: ${{ inputs.gnomon }}
        CONFIG: ${{ inputs.config }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -z "$GNOMON" ]; then
          version=$(python3 -c "import sys, tomllib; print(tomllib.load(open(sys.argv[1], 'rb'))['project']['version'])" "$ACTION_PATH/../../pyproject.toml")
          GNOMON="uvx --from maxitor==$version gnomon"
        fi
        $GNOMON check --config "$CONFIG"
