# packages/aoa-demo/pyproject.toml — publishable distribution for ``aoa.demo``.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aoa-demo"
version = "3.0.0"
description = "Example FastAPI and MCP services demonstrating ActionMachine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "@Bystrov.Maxim" }]
dependencies = [
    "aoa-action-machine>=1.0.0a5,<2.0.0",
    "aoa-ocel>=1.0.0a0",
    "pydantic>=2.0,<3.0",
]

[tool.uv.sources]
aoa-action-machine = { workspace = true }
aoa-fastapi-adapter = { workspace = true }
aoa-mcp-adapter = { workspace = true }
aoa-ocel = { workspace = true }

[project.optional-dependencies]
fastapi = [
    # 1.3.0 tags every GET with an ETag and answers 304, so Maxitor checks the graph-json cheaply (spec 029).
    "aoa-fastapi-adapter>=1.3.0",
]
mcp = [
    "aoa-mcp-adapter>=1.0.0a0",
]
postgres = [
    "asyncpg>=0.29,<1.0",
]

[project.urls]
Homepage = "https://github.com/action-machine/action-machine"
Documentation = "https://action-machine.readthedocs.io"
Repository = "https://github.com/action-machine/action-machine"

[tool.hatch.build.targets.wheel]
packages = ["src/aoa"]

[tool.hatch.build.targets.sdist]
# The saved graph is the repository's history, not the package's (graph-builder.toml).
exclude = ["graph.json"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
