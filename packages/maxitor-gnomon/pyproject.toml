# packages/maxitor-gnomon/pyproject.toml — the graph format of Maxitor; knows nothing about AOA.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxitor-gnomon"
version = "0.1.0"
description = "The graph format of Maxitor: a service keeps its current graph in one file, checked against a versioned schema."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "@Bystrov.Maxim" }]
dependencies = [
    # jsonschema-rs decides whether a document is a graph (the demo's in 0.06 s, not 24 s);
    # jsonschema explains a refusal on the one element jsonschema-rs stopped at.
    "jsonschema>=4.17,<5",
    "jsonschema-rs>=0.60,<1",
]

[project.scripts]
gnomon = "maxitor_gnomon.cli:main"

[project.urls]
Homepage = "https://github.com/bystrovmaxim/aoa"
Repository = "https://github.com/bystrovmaxim/aoa"

[tool.hatch.build.targets.wheel]
packages = ["src/maxitor_gnomon"]

# The skills live at the package's top level and travel inside the wheel, next to the code that reads
# them. The graph schemas are copies of the protocol's (packages/open-gnomon-protocol), kept in src.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "maxitor_gnomon/skills"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
