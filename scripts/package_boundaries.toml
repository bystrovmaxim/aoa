# Package import boundaries for production code under packages/*/src/aoa/.
# Keys action_machine | ocel | maxitor | repo_graph_port | examples are canonical internal names.
# may_import lists which other internal packages a package may import (not including itself).

[packages.action_machine]
current_roots = ["packages/aoa-action-machine/src/aoa/action_machine"]
future_roots = ["packages/aoa-action-machine/src/aoa/action_machine"]
import_prefixes = ["action_machine", "aoa.action_machine"]
may_import = []

[packages.ocel]
current_roots = ["packages/aoa-ocel/src/aoa/ocel"]
future_roots = ["packages/aoa-ocel/src/aoa/ocel"]
import_prefixes = ["aoa.ocel"]
may_import = ["action_machine"]

[packages.otel]
current_roots = ["packages/aoa-otel/src/aoa/otel"]
future_roots = ["packages/aoa-otel/src/aoa/otel"]
import_prefixes = ["aoa.otel"]
may_import = ["action_machine"]

[packages.maxitor]
current_roots = ["packages/maxitor/front/src/maxitor/front"]
future_roots = ["packages/maxitor/front/src/maxitor/front"]
import_prefixes = ["maxitor.front"]
may_import = ["action_machine", "graph_builder", "graph_compare", "graph_map"]

# The repo-graph-port service: it never imports the front, and the front reads it over HTTP, never imports it.
[packages.repo_graph_port]
current_roots = ["packages/maxitor/tools/repo_graph_port/src/maxitor/repo_graph_port"]
future_roots = ["packages/maxitor/tools/repo_graph_port/src/maxitor/repo_graph_port"]
import_prefixes = ["maxitor.repo_graph_port"]
may_import = ["action_machine", "graph_builder", "graph_compare"]

[packages.examples]
current_roots = ["packages/aoa-demo/src/aoa/demo"]
future_roots = ["packages/aoa-demo/src/aoa/demo"]
import_prefixes = ["examples", "aoa.demo"]
may_import = ["action_machine", "ocel"]

# Production-only import exceptions (rare). Each row must include path, imports, reason, expires.
allow = []

# Standalone packages live outside the ``aoa`` namespace and may import nothing from ``aoa``.
# ``maxitor.graph_builder`` is Maxitor's graph-file command, installed by ``pip install maxitor`` with no extra:
# it imports nothing from ``aoa`` and nothing of the front, whose dependencies come only with ``[front]``.
[standalone.graph_builder]
roots = ["packages/maxitor/tools/graph_builder/src/maxitor/graph_builder"]
import_prefixes = ["maxitor.graph_builder"]
forbid = ["maxitor.front", "maxitor.repo_graph_port"]

# ``maxitor.graph_compare`` compares two graph documents for the front and the tools alike: it needs the standard
# library alone (its own test checks that) and imports nothing of ``aoa``, the front or a tool.
[standalone.graph_compare]
roots = ["packages/maxitor/core/graph_compare/src/maxitor/graph_compare"]
import_prefixes = ["maxitor.graph_compare"]
forbid = ["maxitor.front", "maxitor.repo_graph_port", "maxitor.graph_builder"]

# ``maxitor.graph_map`` turns a graph document into the map the front reads: the standard library alone, like the comparison.
[standalone.graph_map]
roots = ["packages/maxitor/core/graph_map/src/maxitor/graph_map"]
import_prefixes = ["maxitor.graph_map"]
forbid = ["maxitor.front", "maxitor.repo_graph_port", "maxitor.graph_builder"]
